  --jornal: #f0efeb;
  --jornal-2: #e6e5e0;
  --tinta: #151514;
  --tinta-2: #53524d;
  --tinta-3: #74726b;
  --linha: #e2e1dc;
  --base: #c4c2ba;
  --vermelho: #c4122f;
  --p1: #2a78d6;
  --p2: #eb6834;
  --bom: #17733a;
  --ruim: var(--vermelho);
  --aviso-fundo: #fff2cc;
  --sombra-solta: 0 6px 24px rgba(21,21,20,.16);
  --fonte-folha: "Folha", "Arial Narrow", "Roboto Condensed", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fundo: #131312;
    --jornal: #1f1f1d;
    --jornal-2: #2a2a27;
    --tinta: #f3f2ed;
    --tinta-2: #bebcb4;
    --tinta-3: #97958d;
    --linha: #2c2c29;
    --base: #45443f;
    --vermelho: #ff6b6f;
    --p1: #3987e5;
    --p2: #d95926;
    --bom: #57c27a;
    --aviso-fundo: #3a2f12;
    --sombra-solta: 0 6px 24px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fundo: #131312;
  --jornal: #1f1f1d;
  --jornal-2: #2a2a27;
  --tinta: #f3f2ed;
  --tinta-2: #bebcb4;
  --tinta-3: #97958d;
  --linha: #2c2c29;
  --base: #45443f;
  --vermelho: #ff6b6f;
  --p1: #3987e5;
  --p2: #d95926;
  --bom: #57c27a;
  --aviso-fundo: #3a2f12;
  --sombra-solta: 0 6px 24px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { scrollbar-color: var(--base) transparent; -webkit-text-size-adjust: 100%; }
body {
  background: var(--fundo);
  color: var(--tinta);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  caret-color: var(--tinta);
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--tinta); color: var(--fundo); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; text-decoration-color: var(--base); }
a:hover { text-decoration-color: currentColor; }
strong { font-weight: 650; }
.ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; vertical-align: -3px; }
.ic-p { width: 15px; height: 15px; vertical-align: -2px; }
.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.cond { font-family: var(--fonte-folha); font-weight: 800; }

/* ---------------------------------------------------------------- topo */
.topo { position: sticky; top: 0; z-index: 20; background: var(--fundo); border-bottom: 1px solid var(--linha); }
.topo-dentro {
  max-width: 1180px; margin: 0 auto; padding: 0 32px;
  display: flex; align-items: center; gap: 24px; min-height: 56px;
}
.marca { display: flex; align-items: center; gap: 10px; margin-right: auto; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
.selo { width: 18px; height: 20px; flex: none; }
.nuvem-ind {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--linha); background: var(--fundo); color: var(--tinta-2);
  border-radius: 2px; padding: 3px 9px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.nuvem-ind[hidden] { display: none; }
.nuvem-ind:hover { border-color: var(--base); color: var(--tinta); }
.nuvem-ind.erro { color: var(--vermelho); border-color: currentColor; }
.nuvem-ind .ic { width: 14px; height: 14px; vertical-align: 0; }
.abas { display: flex; gap: 2px; }
.aba {
  position: relative; display: flex; align-items: center; gap: 8px;
  height: 56px; padding: 0 12px; border: 0; background: none; cursor: pointer;
  color: var(--tinta-2); font-weight: 500; white-space: nowrap;
}
.aba:hover { color: var(--tinta); }
.aba[aria-selected="true"] { color: var(--tinta); font-weight: 650; }
.aba[aria-selected="true"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 3px; background: var(--tinta); }

main { max-width: 1180px; margin: 0 auto; padding: 0 32px 64px; }
.painel { display: none; }
.painel.ativo { display: block; }

/* Cabeçalho da folha: o mês (ou o nome da aba) em algarismo de folhinha */
.cab-folha {
  display: flex; align-items: flex-end; justify-content: space-between; gap: 16px;
  padding: 32px 0 18px; border-bottom: 3px solid var(--tinta); margin-bottom: 32px;
}
.cab-titulo {
  margin: 0; font-family: var(--fonte-folha); font-weight: 800; font-size: 88px; line-height: .8;
  letter-spacing: -0.005em; text-transform: uppercase; text-wrap: balance;
}
.cab-titulo .ano { color: var(--tinta-3); }
.mes-nav { display: flex; gap: 6px; flex: none; }
.mes-nav button {
  width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer;
  border: 1px solid var(--base); background: var(--fundo); border-radius: 2px;
}
.mes-nav button:hover { background: var(--jornal); border-color: var(--tinta-3); }
.mes-nav .ic { width: 20px; height: 20px; }

/* ------------------------------------------------------------- blocos */
.bloco + .bloco { margin-top: 44px; }
.bloco-titulo {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  margin: 0 0 12px; font-family: var(--fonte-folha); font-weight: 800; font-size: 26px; line-height: 1;
  text-transform: uppercase; letter-spacing: .005em;
}
.bloco-titulo small { font: 400 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--tinta-2); text-transform: none; letter-spacing: 0; }
.sub-titulo { margin: 30px 0 8px; font-family: var(--fonte-folha); font-weight: 800; font-size: 19px; line-height: 1.1; text-transform: uppercase; letter-spacing: .01em; }
.sub-titulo small { font: 400 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--tinta-2); text-transform: none; letter-spacing: 0; }
.sub { color: var(--tinta-2); font-size: 14px; }
.mudo { color: var(--tinta-3); }
.nota { font-size: 13px; color: var(--tinta-2); margin: 8px 0 0; max-width: 72ch; }
.acima { color: var(--vermelho); }
.entrou { color: var(--bom); }
p { max-width: 72ch; }

.bolinha { display: inline-block; width: 10px; height: 10px; border-radius: 1px; flex: none; }
.b-p1 { background: var(--p1); }
.b-p2 { background: var(--p2); }
.legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--tinta-2); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }

/* ------------------------------------------------------------- resumo */
.res-grade { display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr); gap: 56px; align-items: start; }

.orc-valor { font-family: var(--fonte-folha); font-weight: 800; font-size: 68px; line-height: .9; letter-spacing: -0.005em; font-variant-numeric: lining-nums; }
.orc-de { color: var(--tinta-3); font-size: .62em; white-space: nowrap; }
.orc-total { margin: 14px 0 0; padding-top: 10px; border-top: 1px solid var(--linha); font-size: 14px; color: var(--tinta-2); }
.orc-total strong { color: var(--tinta); }
.orc-frase { margin: 10px 0 0; font-size: 16px; color: var(--tinta-2); }
.orc-frase strong { color: var(--tinta); }
.orc-frase .delta { display: inline-flex; align-items: center; gap: 4px; color: var(--tinta); margin-left: 14px; white-space: nowrap; }
.dia-detalhe + .bloco { margin-top: 44px; }
.medidor { position: relative; height: 12px; background: var(--jornal-2); margin: 22px 0 10px; }
.medidor-cheio { position: absolute; left: 0; top: 0; bottom: 0; background: var(--tinta); }
.medidor-cheio.passou { background: var(--vermelho); }
.medidor-fim { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--tinta-3); }
.medidor-ritmo { position: absolute; top: -6px; bottom: -6px; width: 2px; margin-left: -1px; background: var(--tinta); box-shadow: 0 0 0 2px var(--fundo); }
.medidor-linhas { display: flex; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; font-size: 14px; color: var(--tinta-2); }
.medidor-linhas strong { color: var(--tinta); }
.ritmo-frase { margin: 6px 0 0; font-size: 14px; color: var(--tinta-2); }

.folha { margin-top: 30px; }
.folha-sem, .folha-dias { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.folha-sem { background: var(--tinta); }
.folha-sem div { padding: 6px 0 5px; text-align: center; font-family: var(--fonte-folha); font-weight: 800; font-size: 15px; letter-spacing: .04em; color: var(--fundo); }
.folha-dias { border-left: 1px solid var(--linha); }
.dia, .dia-fora {
  min-height: 74px; border: 0; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha);
  background: none; padding: 7px 7px 11px; text-align: left; position: relative;
  display: flex; flex-direction: column; align-items: flex-start; min-width: 0;
}
.dia { cursor: pointer; transition: background-color .15s cubic-bezier(.16, 1, .3, 1); }
.dia:hover { background: var(--jornal); }
.dia-n { font-family: var(--fonte-folha); font-weight: 800; font-size: 28px; line-height: .9; }
.dia-v { margin-top: auto; padding-top: 4px; font-size: 12px; line-height: 1.2; color: var(--tinta-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dia-barra { position: absolute; left: 7px; right: 7px; bottom: 5px; height: 3px; display: flex; gap: 1px; }
.dia-barra span { height: 100%; }
.dia.futuro { cursor: default; }
.dia.futuro .dia-n { color: var(--tinta-3); font-weight: 600; }
.dia.futuro:hover { background: none; }
.dia.acima .dia-n, .dia.acima .dia-v { color: var(--vermelho); }
.dia.hoje { box-shadow: inset 0 0 0 2px var(--tinta); }
.dia-f { margin-top: 3px; max-width: 100%; font-family: var(--fonte-folha); font-size: 13px; font-weight: 600; line-height: 1; color: var(--tinta);
  overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dia.feriado.futuro { cursor: pointer; }
.dia.feriado.futuro:hover { background: var(--jornal); }
.dia[aria-pressed="true"] { box-shadow: inset 0 4px 0 var(--tinta); background: var(--jornal-2); }
.dia.hoje[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--tinta), inset 0 6px 0 var(--tinta); }
.folha-nota { display: flex; justify-content: space-between; gap: 6px 18px; flex-wrap: wrap; margin-top: 10px; font-size: 13px; color: var(--tinta-2); }

.dia-detalhe { margin-top: 24px; }
.dia-detalhe .cab-dia { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--tinta); }
.cab-dia h3 { margin: 0; font-size: 16px; font-weight: 650; }
.dia-detalhe .lista-simples { animation: surgir .22s cubic-bezier(.16, 1, .3, 1); }
@keyframes surgir { from { opacity: 0; transform: translateY(4px); } }

.cat-linha { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; padding: 12px 0; border-bottom: 1px solid var(--linha); }
.cat-linha:first-of-type { border-top: 1px solid var(--tinta); }
.cat-nome { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-valor { font-size: 15px; font-weight: 650; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat-trilho { grid-column: 1 / -1; position: relative; height: 8px; background: var(--jornal); }
.cat-barra { display: flex; height: 100%; gap: 1px; }
.cat-barra > div { height: 100%; min-width: 0; }
.cat-meta { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--tinta); }
.cat-orc { grid-column: 1 / -1; font-size: 13px; color: var(--tinta-2); display: flex; align-items: center; gap: 6px; }
.cat-orc.acima { color: var(--vermelho); font-weight: 600; }

.pessoas-res { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--tinta); }
.pessoa-res { padding: 14px 18px 14px 0; min-width: 0; }
.pessoa-res + .pessoa-res { border-left: 1px solid var(--linha); padding: 14px 0 14px 18px; }
.pessoa-nome { display: flex; align-items: center; gap: 8px; font-weight: 650; }
.pessoa-valor { font-family: var(--fonte-folha); font-weight: 800; font-size: 40px; line-height: .95; margin: 6px 0 6px; }
.pessoa-det { font-size: 13px; color: var(--tinta-2); line-height: 1.45; }
.casal-linha { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 0; border-top: 1px solid var(--linha); border-bottom: 1px solid var(--linha); font-size: 14px; }

/* Colunas por mês */
.colunas { display: flex; align-items: flex-end; gap: 10px; height: 150px; padding-top: 8px; border-bottom: 1px solid var(--tinta); margin-top: 12px; }
.coluna { flex: 1; display: flex; flex-direction: column-reverse; gap: 1px; height: 100%; cursor: default; position: relative; }
.coluna > div { width: 100%; max-width: 44px; margin: 0 auto; }
.coluna.atual::before { content: ""; position: absolute; inset: -4px 0 -1px; border: 2px solid var(--tinta); border-bottom: 0; pointer-events: none; }
.colunas.baixas { height: 120px; }
.col-rotulos { display: flex; gap: 10px; margin-top: 6px; }
.col-rotulos div { flex: 1; text-align: center; font-size: 12px; color: var(--tinta-3); line-height: 1.35; font-variant-numeric: tabular-nums; }
.col-rotulos .atual-rotulo { color: var(--tinta); font-weight: 650; }

.dica {
  position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--fundo); color: var(--tinta); border: 1px solid var(--tinta);
  padding: 8px 10px; font-size: 13px; box-shadow: var(--sombra-solta);
  max-width: 260px; white-space: pre-line;
}

.lista-simples { list-style: none; margin: 0; padding: 0; }
.lista-simples li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
.lista-simples .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.desc-curta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.desc-curta .bolinha { margin-right: 4px; }
.lista-topo { border-top: 1px solid var(--tinta); }
.vazio-curto { padding: 12px 0; color: var(--tinta-2); font-size: 14px; }

/* --------------------------------------------------------- transações */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--jornal); padding: 12px; margin-bottom: 8px; }
.filtros input[type="search"] { flex: 1 1 220px; }
.filtros label.sub { display: inline-flex; align-items: center; gap: 6px; }
.filtros .botao { margin-left: auto; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], select {
  background: var(--fundo); border: 1px solid var(--base); border-radius: 2px; padding: 7px 10px; min-height: 40px;
}
input::placeholder { color: var(--tinta-3); }
input[type="checkbox"], input[type="radio"] { accent-color: var(--tinta); width: 16px; height: 16px; }
select:hover, input[type="text"]:hover, input[type="search"]:hover, input[type="number"]:hover, input[type="date"]:hover { border-color: var(--tinta-3); }
input:focus-visible, select:focus-visible, button:focus-visible, a:focus-visible, label:focus-within {
  outline: 2px solid var(--tinta); outline-offset: 2px;
}
input:focus-visible, select:focus-visible { outline-offset: 0; border-color: var(--tinta); }
.escolha-pessoa label:focus-within { outline-offset: 2px; }
.botao {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--base); background: var(--fundo); border-radius: 2px; padding: 7px 14px;
  cursor: pointer; min-height: 40px; font-weight: 550; white-space: nowrap;
}
.botao:hover { background: var(--jornal); border-color: var(--tinta-3); }
.botao:active { background: var(--jornal-2); }
.botao.primario { background: var(--tinta); color: var(--fundo); border-color: var(--tinta); }
.botao.primario:hover { background: var(--tinta-2); border-color: var(--tinta-2); }
.botao.perigo { color: var(--vermelho); }
.botao.perigo:hover { border-color: var(--vermelho); }
.botao:disabled { opacity: .45; cursor: not-allowed; }
.botao-x { display: grid; place-items: center; width: 32px; height: 32px; border: 0; background: none; cursor: pointer; color: var(--tinta-3); border-radius: 2px; }
.botao-x:hover { background: var(--jornal); color: var(--vermelho); }

.tx-cab, .tx {
  display: grid; grid-template-columns: minmax(0, 1fr) 128px 204px 130px 108px 32px;
  gap: 10px; align-items: center; padding: 8px 4px;
}
.tx-cab { font-size: 12px; font-weight: 600; color: var(--tinta-2); padding-top: 12px; }
.tx { border-bottom: 1px solid var(--linha); font-size: 14px; }
.tx .valor { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.tx .entrada { color: var(--bom); }
.tx .fora { color: var(--tinta-3); text-decoration: line-through; font-weight: 400; }
.tx select { width: 100%; padding: 4px 8px; min-height: 36px; font-size: 13px; }
.tx .quem { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tinta-2); white-space: nowrap; overflow: hidden; }
.tx-desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx-texto { font-size: 13px; color: var(--tinta-3); }
.tx-dia { display: flex; align-items: center; gap: 12px; padding: 22px 4px 8px; border-bottom: 2px solid var(--tinta); }
.tx-dia-s { font-size: 14px; font-weight: 600; line-height: 1.25; }
.tx-dia-s small { display: block; font-size: 12px; font-weight: 400; color: var(--tinta-2); }
.mini-folha.peq { width: 44px; }
.mini-folha.peq .mf-cab { font-size: 10px; padding: 1px 0; }
.mini-folha.peq .mf-n { font-size: 23px; padding: 3px 0 4px; }
.tx-dia-t { margin-left: auto; font-size: 13px; color: var(--tinta-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.etiqueta {
  display: inline-block; font-size: 11px; font-weight: 650; letter-spacing: .01em;
  padding: 0 5px; border: 1px dashed var(--tinta-3); color: var(--tinta-2); vertical-align: 1px; margin-right: 4px;
}
.tx.pendente .valor { color: var(--tinta-2); }
.tx-total { display: flex; justify-content: space-between; gap: 12px; padding: 12px 4px; font-weight: 650; border-top: 2px solid var(--tinta); margin-top: -1px; }
.vazio-lista { padding: 40px 4px; color: var(--tinta-2); }

/* --------------------------------------------------------------- cartão */
.cartao-grade { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start; }
.cartao-cab { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 0 0 14px; padding-bottom: 10px; border-bottom: 2px solid var(--tinta); }
.cartao-cab .nome { font-family: var(--fonte-folha); font-weight: 800; font-size: 30px; line-height: 1; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
.cartao-cab .bolinha { width: 12px; height: 12px; }
.cartao-cab .mudo { font-size: 13px; }
.fatura-rotulo { font-size: 14px; color: var(--tinta-2); }
.fatura-atual { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; margin-top: 4px; }
.fatura-atual .valor { font-family: var(--fonte-folha); font-weight: 800; font-size: 60px; line-height: .86; }
.datas { display: flex; gap: 8px; }
.mini-folha { width: 62px; border: 1px solid var(--tinta); text-align: center; background: var(--fundo); }
.mini-folha .mf-cab { background: var(--tinta); color: var(--fundo); font-size: 11px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; padding: 2px 0; }
.mini-folha .mf-n { font-family: var(--fonte-folha); font-weight: 800; font-size: 30px; line-height: 1; padding-top: 4px; }
.mini-folha .mf-m { font-size: 11px; color: var(--tinta-2); padding-bottom: 4px; }
.limite { margin: 0 0 22px; }
.limite-trilho { height: 8px; background: var(--jornal-2); margin: 8px 0 6px; }
.limite-uso { height: 100%; }
.parcela-n { font-variant-numeric: tabular-nums; color: var(--tinta-2); white-space: nowrap; }
.sem-dados { padding: 18px 0; color: var(--tinta-2); }

/* -------------------------------------------------------------- importar */
.soltar {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  border: 2px dashed var(--base); padding: 36px 16px; text-align: center; cursor: pointer; color: var(--tinta-2);
  transition: border-color .15s, background-color .15s;
}
.soltar:hover, .soltar.por-cima { border-color: var(--tinta); background: var(--jornal); }
.soltar strong { color: var(--tinta); font-size: 17px; }

function normalizar(s) {
  return String(s == null ? "" : s)
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();

function contemTermo(descNorm, termoNorm) {
  if (!termoNorm) return false;
  return (" " + descNorm + " ").indexOf(" " + termoNorm + " ") !== -1;

/* Hash curto e estável (FNV-1a, duas sementes). Serve para dar um id fixo a
   transações que não trazem id - a mesma linha importada duas vezes cai no
   mesmo id e não duplica. */
function hash(s) {
  var a = 0x811c9dc5, b = 0x01000193 ^ 0x5bd1e995;
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    a ^= c; a = Math.imul(a, 0x01000193) >>> 0;
    b ^= c; b = Math.imul(b, 0x5bd1e995) >>> 0; b ^= b >>> 15;
  }
  return ("0000000" + a.toString(16)).slice(-8) + ("0000000" + (b >>> 0).toString(16)).slice(-8);
}

/* "1.234,56" / "-45.90" / "R$ 12,00" -> número */
function lerValor(s) {
  if (typeof s === "number") return s;
  var t = String(s || "").replace(/[R$\s ]/g, "");
  if (!t) return NaN;
  var neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  var v = t.lastIndexOf(","), p = t.lastIndexOf(".");
  if (v > -1 && p > -1) {
    if (v > p) t = t.replace(/\./g, "").replace(",", ".");
    else t = t.replace(/,/g, "");
  } else if (v > -1) {
    t = t.replace(",", ".");
  }
  var n = parseFloat(t);
  return neg ? -n : n;
}

/* "2024-01-15", "15/01/2024", "20240115120000[-3:BRT]" -> "2024-01-15" */
function lerData(s) {
  var t = String(s || "").trim(), m;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t))) return m[1] + "-" + m[2] + "-" + m[3];
  if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t)))
    return m[3] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);

  return null;

  var primeira = texto.split(/\r?\n/)[0] || "";
  var sep = (primeira.split(";").length > primeira.split(",").length) ? ";" : ",";
  var linhas = [], campo = "", linha = [], aspas = false;
  for (var i = 0; i < texto.length; i++) {
    var c = texto[i];
    if (aspas) {
      if (c === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false;
      } else campo += c;
    } else if (c === '"' && campo === "") aspas = true;
    else if (c === sep) { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); campo = "";
      if (linha.length > 1 || linha[0] !== "") linhas.push(linha);
      linha = [];
    } else campo += c;
  }
  linha.push(campo);
  if (linha.length > 1 || linha[0] !== "") linhas.push(linha);
  return linhas;
}

function detectarFormato(texto) {
  var t = String(texto).replace(/^﻿/, "");
  if (/<OFX>|OFXHEADER/i.test(t.slice(0, 2000))) return "ofx";
  var cab = normalizar((t.split(/\r?\n/)[0] || ""));
  if (contemTermo(cab, "title") && contemTermo(cab, "amount")) return "nubank-cartao";
  if (contemTermo(cab, "identificador") && contemTermo(cab, "descricao")) return "nubank-conta";
  if (contemTermo(cab, "data") && contemTermo(cab, "valor")) return "csv-generico";
  return null;
}

/* Lê um arquivo exportado do Nubank e devolve as transações já com o sinal
   do app. tipo = "cartao" | "conta" (o que o arquivo é). */
function lerArquivo(texto) {
  var formato = detectarFormato(texto);
  if (!formato) throw new Error("Formato não reconhecido. Use o CSV ou OFX exportado pelo Nubank.");
  var itens = [], tipo;

  if (formato === "ofx") {
    tipo = /<CREDITCARDMSGSRSV1>|<CCSTMTRS>/i.test(texto) ? "cartao" : "conta";
    var blocos = String(texto).match(/<STMTTRN>[\s\S]*?(<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi) || [];
    blocos.forEach(function (b) {
      var tag = function (n) {
        var m = new RegExp("<" + n + ">([^<\\r\\n]*)", "i").exec(b);
        return m ? m[1].trim() : "";
      };
      var valor = lerValor(tag("TRNAMT"));
      var data = lerData(tag("DTPOSTED"));
      if (isNaN(valor) || !data) return;
      itens.push({
        data: data,
        descricao: tag("MEMO") || tag("NAME") || "(sem descrição)",
        valor: arred(-valor),
        idExterno: tag("FITID") || null
      });
    });
  } else {
    var linhas = lerCSV(texto);
    var cab = linhas.shift().map(normalizar);
    var col = function (nomes) {
      for (var i = 0; i < nomes.length; i++) {
        var k = cab.indexOf(nomes[i]);
        if (k > -1) return k;
      }
      return -1;
    };
    var cData, cDesc, cValor, cId = -1, inverte;
    if (formato === "nubank-cartao") {
      tipo = "cartao";
      cData = col(["date"]); cDesc = col(["title"]); cValor = col(["amount"]);
      inverte = false;            // fatura: compra vem positiva
    } else if (formato === "nubank-conta") {
      tipo = "conta";
      cData = col(["data"]); cDesc = col(["descricao"]); cValor = col(["valor"]);
      cId = col(["identificador"]);
      inverte = true;             // extrato: saída vem negativa
    } else {
      tipo = "conta";
      cData = col(["data", "date"]); cDesc = col(["descricao", "historico", "title", "lancamento"]);
      cValor = col(["valor", "amount"]);
      inverte = true;
    }
    if (cData < 0 || cValor < 0) throw new Error("O arquivo não tem as colunas de data e valor.");
    linhas.forEach(function (l) {
      var data = lerData(l[cData]), valor = lerValor(l[cValor]);
      if (!data || isNaN(valor)) return;
      itens.push({
        data: data,
        descricao: (cDesc > -1 ? l[cDesc] : "").trim() || "(sem descrição)",
        valor: arred(inverte ? -valor : valor),
        idExterno: cId > -1 && l[cId] ? l[cId].trim() : null
      });
    });
  }
  return { formato: formato, tipo: tipo, itens: itens };
}

/* --------------------------------------------------------------- estado */

function estadoPadrao() {
  var regras = [];
  Object.keys(TERMOS_PADRAO).forEach(function (cat) {
    TERMOS_PADRAO[cat].forEach(function (t) { regras.push({ termo: t, categoria: cat, divisao: "" }); });
  });
  return {
    versao: 1,
    pessoas: {
      p1: { nome: "Eu", nomeBanco: "" },
      p2: { nome: "Namorada", nomeBanco: "" }
    },
    divisao: { p1: 50 },          // % das despesas do casal que cabe à p1
    categorias: CATEGORIAS_PADRAO.map(function (c) { return Object.assign({}, c); }),
    regras: regras,
    transacoes: [],
    apagadas: {},                 // id -> quando foi apagada (para não voltar na sincronização)
    cartoes: {},                  // id da conta no Pluggy -> limite, faturas, previstas (do banco)
    pendentes: {},                // pessoa -> { geradoEm, lista }: o que o banco ainda não fechou
    conexoes: {},                 // pessoa -> até quando o Pluggy buscou no banco
    configAlterada: 0,            // quando nomes/categorias/regras mudaram pela última vez
    pluggy: { geradoEm: null }
  };
}

/* Completa um estado salvo com o que faltar (versões futuras, backup velho). */
function completar(e) {
  var p = estadoPadrao();
  if (!e || typeof e !== "object") return p;
  e.pessoas = e.pessoas || p.pessoas;
  PESSOAS.forEach(function (id) { e.pessoas[id] = Object.assign({ nome: p.pessoas[id].nome, nomeBanco: "" }, e.pessoas[id]); });
  e.divisao = e.divisao || p.divisao;
  e.categorias = Array.isArray(e.categorias) ? e.categorias : p.categorias;
  ["outros", "entradas", "entre", "fora"].forEach(function (id) {
    if (!e.categorias.some(function (c) { return c.id === id; }))
      e.categorias.push(Object.assign({}, CATEGORIAS_PADRAO.filter(function (c) { return c.id === id; })[0]));
  });
  e.regras = Array.isArray(e.regras) ? e.regras : p.regras;
  e.transacoes = Array.isArray(e.transacoes) ? e.transacoes : [];
  e.pluggy = e.pluggy || { geradoEm: null };
  e.apagadas = e.apagadas && typeof e.apagadas === "object" ? e.apagadas : {};
  e.configAlterada = Number(e.configAlterada) || 0;
  e.cartoes = e.cartoes && typeof e.cartoes === "object" && !Array.isArray(e.cartoes) ? e.cartoes : {};
  e.pendentes = e.pendentes && typeof e.pendentes === "object" && !Array.isArray(e.pendentes) ? e.pendentes : {};
  e.conexoes = e.conexoes && typeof e.conexoes === "object" && !Array.isArray(e.conexoes) ? e.conexoes : {};
  return e;
}

function pessoaDaConta(contaId) { return String(contaId).split("-")[0]; }
function tipoDaConta(contaId) { return String(contaId).split("-")[1]; }
function outra(p) { return p === "p1" ? "p2" : "p1"; }
function mesDe(data) { return String(data).slice(0, 7); }
function categoria(e, id) {
  for (var i = 0; i < e.categorias.length; i++) if (e.categorias[i].id === id) return e.categorias[i];
  return null;
}
function ehGasto(t) { return !ESPECIAIS[t.categoria]; }
function pct(e, p) {
  var a = Math.min(100, Math.max(0, Number(e.divisao.p1)));
  if (isNaN(a)) a = 50;
  return (p === "p1" ? a : 100 - a) / 100;
}

/* Decide categoria e divisão de uma transação nova. Ordem:
   1. Pix/transferência para a outra pessoa (pelo nome no banco) -> "entre"
   2. regras do usuário (termo mais longo ganha: "uber eats" antes de "uber")
   3. dica do Pluggy
   4. valor negativo sem regra: na conta é entrada; no cartão é estorno
   5. "outros" */
function categorizar(e, descricao, valor, contaId, dicaPluggy) {
  var d = normalizar(descricao);
  var dono = pessoaDaConta(contaId);
  var cat = null, div = "";

  var nomeOutra = normalizar(e.pessoas[outra(dono)] && e.pessoas[outra(dono)].nomeBanco);
  if (nomeOutra && contemTermo(d, nomeOutra) &&
      /transf|pix|ted|doc/.test(d)) cat = "entre";

  if (!cat) {
    var melhor = null;
    e.regras.forEach(function (r) {
      var t = normalizar(r.termo);
      if (t && contemTermo(d, t) && (!melhor || t.length > melhor.t.length)) melhor = { t: t, r: r };
    });
    if (melhor && categoria(e, melhor.r.categoria)) { cat = melhor.r.categoria; div = melhor.r.divisao || ""; }
  }

  if (!cat && dicaPluggy) {
    var h = normalizar(dicaPluggy);
    for (var i = 0; i < MAPA_PLUGGY.length; i++) {
      if (h.indexOf(MAPA_PLUGGY[i][0]) !== -1) { cat = MAPA_PLUGGY[i][1]; break; }
    }
  }

  if (!cat && valor < 0) cat = tipoDaConta(contaId) === "cartao" ? "outros" : "entradas";
  if (!cat) cat = "outros";

  if (!div) {
    var c = categoria(e, cat);
    div = c && c.casal ? "casal" : "pessoal";
  }
  return { categoria: cat, divisao: div };
}

/* Põe as transações lidas de um arquivo dentro do estado, sem duplicar.
   Linhas idênticas no mesmo arquivo (dois cafés iguais no mesmo dia) viram
   ids diferentes pela ordem de aparição - e reimportar o arquivo dá os
   mesmos ids de novo. */
function importar(e, contaId, itens, origem) {
  var existentes = {};
  e.transacoes.forEach(function (t) { existentes[t.id] = true; });
  Object.keys(e.apagadas || {}).forEach(function (id) { existentes[id] = true; });
  var vistos = {}, novas = 0, repetidas = 0, agora = Date.now();
  itens.forEach(function (it) {
    var id;
    if (it.id) id = it.id;
    else if (it.idExterno) id = hash(contaId + "|" + it.idExterno);
    else {
      var chave = contaId + "|" + it.data + "|" + normalizar(it.descricao) + "|" + it.valor.toFixed(2);
      vistos[chave] = (vistos[chave] || 0) + 1;
      id = hash(chave + "|" + vistos[chave]);
    }
    if (existentes[id]) { repetidas++; return; }
    existentes[id] = true;
    var c = categorizar(e, it.descricao, it.valor, contaId, it.dica);
    e.transacoes.push({
      id: id, conta: contaId, data: it.data, descricao: it.descricao,
      valor: arred(it.valor), categoria: c.categoria, divisao: c.divisao, origem: origem,
      alterado: agora
    });
    copiarCamposCartao(e.transacoes[e.transacoes.length - 1], it);
    novas++;
  });
  e.transacoes.sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
  return { novas: novas, repetidas: repetidas };
}

/* Os dados do financas_pluggy.py: window.FINANCAS_PLUGGY */
/* Campos do cartão que vêm do Pluggy: parcela 3 de 10, a fatura em que a
   compra cai (AAAA-MM, mês do vencimento) e o id da fatura no banco. */
var CAMPOS_CARTAO = ["parcela", "parcelas", "fatura", "billId"];
function copiarCamposCartao(t, it) {
  var mudou = false;
  CAMPOS_CARTAO.forEach(function (k) {
    if (it[k] != null && it[k] !== "" && t[k] == null) { t[k] = it[k]; mudou = true; }
  });
  return mudou;
}

/* Os dados do financas_pluggy.py: window.FINANCAS_PLUGGY */
function importarPluggy(e, dados) {
  if (!dados || !Array.isArray(dados.transacoes)) return { novas: 0, repetidas: 0, cartoes: 0, completadas: 0 };
  var porConta = {}, porId = {};
  e.transacoes.forEach(function (t) { porId[t.id] = t; });
  var completadas = 0;
  dados.transacoes.forEach(function (t) {
    if (PESSOAS.indexOf(t.pessoa) === -1) return;
    var conta = t.pessoa + "-" + (t.tipo === "cartao" ? "cartao" : "conta");
    var it = {
      id: "pg-" + t.id, data: t.data, descricao: t.descricao, valor: Number(t.valor), dica: t.categoriaPluggy,
      parcela: t.parcela, parcelas: t.parcelas, fatura: t.fatura, billId: t.billId
    };
    // transação que já veio antes, sem os dados do cartão: completa (uma vez)
    if (porId[it.id] && copiarCamposCartao(porId[it.id], it)) completadas++;
    // e se a data mudou (versões antigas do script punham compra da noite no
    // dia seguinte, pelo fuso), acerta - a data não é editável no app
    var ja = porId[it.id];
    if (ja && it.data && ja.data !== it.data && /^\d{4}-\d{2}-\d{2}$/.test(it.data)) {
      ja.data = it.data; ja.alterado = Date.now(); completadas++;
    }
    (porConta[conta] = porConta[conta] || []).push(it);
  });
  var tot = { novas: 0, repetidas: 0, cartoes: 0, completadas: completadas };
  Object.keys(porConta).forEach(function (conta) {
    var r = importar(e, conta, porConta[conta], "pluggy");
    tot.novas += r.novas; tot.repetidas += r.repetidas;
  });
  (dados.cartoes || []).forEach(function (c) {
    if (!c || !c.conta || PESSOAS.indexOf(c.pessoa) === -1) return;
    var atual = e.cartoes[c.conta];
    if (!atual || String(c.atualizadoEm || "") > String(atual.atualizadoEm || "")) {
      e.cartoes[c.conta] = JSON.parse(JSON.stringify(c));
      tot.cartoes++;
    }
  });
  // pendentes: a lista de cada pessoa é trocada inteira pela mais nova
  tot.pendentes = 0;
  Object.keys(dados.pendentes || {}).forEach(function (p) {
    var n = dados.pendentes[p];
    if (PESSOAS.indexOf(p) === -1 || !n || !Array.isArray(n.lista)) return;
    var a = e.pendentes[p];
    if (!a || String(n.geradoEm || "") > String(a.geradoEm || "")) {
      if (!a || canonico(a.lista) !== canonico(n.lista)) tot.pendentes++;
      e.pendentes[p] = JSON.parse(JSON.stringify({ geradoEm: n.geradoEm || null, lista: n.lista }));
    }
  });
  tot.conexoes = 0;
  Object.keys(dados.conexoes || {}).forEach(function (p) {
    var c = dados.conexoes[p], a = e.conexoes[p];
    if (PESSOAS.indexOf(p) === -1 || !c) return;
    var lido = dados.geradoEm || "";
    if (!a || String(lido) > String(a.lidoEm || "")) {
      if (!a || a.sincronizado !== c.sincronizado || a.proxima !== c.proxima) tot.conexoes++;
      e.conexoes[p] = { banco: c.banco || "", status: c.status || "", sincronizado: c.sincronizado || null,
                        proxima: c.proxima || null, lidoEm: lido };
    }
  });
  e.pluggy.geradoEm = dados.geradoEm || null;
  return tot;
}

/* Reaplica as regras nas transações que ninguém editou à mão. */
function reaplicarRegras(e) {
  var mudou = 0;
  e.transacoes.forEach(function (t) {
    if (t.manual) return;
    var c = categorizar(e, t.descricao, t.valor, t.conta, null);
    if (t.origem === "pluggy" && c.categoria === "outros") return; // mantém a dica do Pluggy
    if (c.categoria !== t.categoria || c.divisao !== t.divisao) {
      t.categoria = c.categoria; t.divisao = c.divisao; t.alterado = Date.now(); mudou++;
    }
  });
  return mudou;
}

/* Junta outro estado a este: o backup de outro aparelho ou o que veio da
   nuvem. É o que deixa os dois mexerem ao mesmo tempo sem um apagar o do
   outro:
   - transação: vale a versão editada por último (campo "alterado");
   - transação apagada em qualquer lado fica apagada nos dois;
   - nomes, categorias, regras e divisão andam juntos: vale o bloco
     mexido por último (configAlterada).
   Devolve quantas transações novas chegaram. */
function mesclar(e, outro) {
  outro = completar(outro);
  Object.keys(outro.apagadas).forEach(function (id) {
    e.apagadas[id] = Math.max(e.apagadas[id] || 0, outro.apagadas[id] || 0);
  });
  var porId = {};
  e.transacoes.forEach(function (t) { porId[t.id] = t; });
  var novas = 0;
  outro.transacoes.forEach(function (t) {
    if (e.apagadas[t.id]) return;
    var a = porId[t.id];
    if (!a) { t = JSON.parse(JSON.stringify(t)); e.transacoes.push(t); porId[t.id] = t; novas++; return; }
    var ta = t.alterado || 0, aa = a.alterado || 0;
    if (ta > aa || (ta === aa && t.manual && !a.manual)) {
      Object.keys(a).forEach(function (k) { delete a[k]; });
      Object.assign(a, JSON.parse(JSON.stringify(t)));
    }
  });
  e.transacoes = e.transacoes.filter(function (t) { return !e.apagadas[t.id]; });
  if (outro.configAlterada > e.configAlterada) {
    var copia = JSON.parse(JSON.stringify(outro));
    e.pessoas = copia.pessoas; e.divisao = copia.divisao;
    e.categorias = copia.categorias; e.regras = copia.regras;
    e.configAlterada = copia.configAlterada;
  }
  PESSOAS.forEach(function (p) {
    var a = e.pendentes[p], b = outro.pendentes[p];
    if (b && (!a || String(b.geradoEm || "") > String(a.geradoEm || ""))) e.pendentes[p] = JSON.parse(JSON.stringify(b));
    var c = e.conexoes[p], d = outro.conexoes[p];
    if (d && (!c || String(d.lidoEm || "") > String(c.lidoEm || ""))) e.conexoes[p] = JSON.parse(JSON.stringify(d));
  });
  Object.keys(outro.cartoes).forEach(function (k) {
    var a = e.cartoes[k], b = outro.cartoes[k];
    if (!a || String(b.atualizadoEm || "") > String(a.atualizadoEm || "")) e.cartoes[k] = JSON.parse(JSON.stringify(b));
  });
  if (outro.pluggy.geradoEm && (!e.pluggy.geradoEm || outro.pluggy.geradoEm > e.pluggy.geradoEm))
    e.pluggy.geradoEm = outro.pluggy.geradoEm;
  e.transacoes.sort(function (a, b) {
    return a.data < b.data ? 1 : a.data > b.data ? -1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  });
  return novas;
}

function apagar(e, id) {
  e.apagadas[id] = Date.now();
  e.transacoes = e.transacoes.filter(function (t) { return t.id !== id; });
}

/* JSON com as chaves em ordem: dois estados iguais dão o mesmo texto, não
   importa em que ordem cada aparelho montou os objetos. */
function canonico(x) {
  if (Array.isArray(x)) return "[" + x.map(canonico).join(",") + "]";
  if (x && typeof x === "object") {
    return "{" + Object.keys(x).sort().filter(function (k) { return x[k] !== undefined; })
      .map(function (k) { return JSON.stringify(k) + ":" + canonico(x[k]); }).join(",") + "}";
  }
  return JSON.stringify(x);
}

/* ----------------------------------------------------- nuvem (cifrada) */

/* A senha do casal vira DUAS coisas, pelo PBKDF2: a chave AES que embaralha
   os dados e o id do cofre no servidor. O servidor só vê o id e o texto
   cifrado - sem a senha, não tem como ler nada. O sal é fixo porque a senha
   é o único segredo e precisa dar o mesmo cofre nos dois celulares. */
var SAL = "financas-do-casal/cofre/v1";
var ITERACOES = 310000;
var cripto = raiz.crypto && raiz.crypto.subtle;

function paraB64(bytes) {
  var s = "";
  for (var i = 0; i < bytes.length; i += 0x8000)
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(s);
}
function deB64(t) {
  var s = atob(t), b = new Uint8Array(s.length);
  for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i);
  return b;
}
function limparSenha(senha) { return String(senha || "").normalize("NFC").trim(); }

function derivarCofre(senha) {
  var enc = new TextEncoder();
  return cripto.importKey("raw", enc.encode(limparSenha(senha)), "PBKDF2", false, ["deriveBits"])
    .then(function (base) {
      return cripto.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: enc.encode(SAL), iterations: ITERACOES }, base, 512);
    })
    .then(function (bits) {
      var b = new Uint8Array(bits);
      var id = Array.prototype.map.call(b.subarray(32), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
      return { id: id, chave: paraB64(b.subarray(0, 32)) };
    });
}
function chaveAES(chaveB64) {
  return cripto.importKey("raw", deB64(chaveB64), "AES-GCM", false, ["encrypt", "decrypt"]);
}
function passarPor(bytes, fluxo) {
  return new Response(new Blob([bytes]).stream().pipeThrough(fluxo)).arrayBuffer()
    .then(function (b) { return new Uint8Array(b); });
}
function cifrar(chaveB64, objeto) {
  var bruto = new TextEncoder().encode(JSON.stringify(objeto));
  var zip = typeof CompressionStream !== "undefined";
  var iv = raiz.crypto.getRandomValues(new Uint8Array(12));
  return (zip ? passarPor(bruto, new CompressionStream("gzip")) : Promise.resolve(bruto))
    .then(function (dados) {
      return chaveAES(chaveB64).then(function (k) { return cripto.encrypt({ name: "AES-GCM", iv: iv }, k, dados); });
    })
    .then(function (c) {
      return JSON.stringify({ v: 1, z: zip, iv: paraB64(iv), d: paraB64(new Uint8Array(c)) });
    });
}
function decifrar(chaveB64, texto) {
  var env = JSON.parse(texto);
  return chaveAES(chaveB64)
    .then(function (k) { return cripto.decrypt({ name: "AES-GCM", iv: deB64(env.iv) }, k, deB64(env.d)); })
    .then(function (b) {
      b = new Uint8Array(b);
      return env.z ? passarPor(b, new DecompressionStream("gzip")) : b;
    })
    .then(function (b) { return JSON.parse(new TextDecoder().decode(b)); });
}

/* Senha aleatória fácil de ditar: 4 grupos de 4, sem 0/o/1/l/i (~79 bits). */
function gerarSenha() {
  var letras = "abcdefghjkmnpqrstuvwxyz23456789";
  var b = raiz.crypto.getRandomValues(new Uint8Array(16)), s = "";
  for (var i = 0; i < 16; i++) {
    if (i && i % 4 === 0) s += "-";
    s += letras[b[i] % letras.length];
  }
  return s;
}

/* ---------------------------------------------------------------- contas */

/* As transações mais as pendentes (ainda não fechadas no banco), marcadas
   com pendente: true. As pendentes não ficam guardadas como transação - a
   cada sincronização a lista é trocada, e quando uma fecha ela volta como
   transação normal. Se o banco manteve o id ao fechar, a pendente sai daqui. */
function comPendentes(e) {
  var ids = {};
  e.transacoes.forEach(function (t) { ids[t.id] = true; });
  var extra = [];
  PESSOAS.forEach(function (p) {
    var bloco = e.pendentes[p];
    ((bloco && bloco.lista) || []).forEach(function (x) {
      if (ids["pg-" + x.id] || e.apagadas["pg-" + x.id]) return;
      var valor = Number(x.valor);
      if (!x.data || !isFinite(valor)) return;
      var conta = p + "-" + (x.tipo === "cartao" ? "cartao" : "conta");
      var c = categorizar(e, x.descricao, valor, conta, x.categoriaPluggy);
      extra.push({
        id: "pend-" + x.id, conta: conta, data: x.data, descricao: x.descricao, valor: arred(valor),
        categoria: c.categoria, divisao: c.divisao, origem: "pluggy", pendente: true
      });
    });
  });
  if (!extra.length) return e.transacoes;
  return e.transacoes.concat(extra).sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
}

function resumoMes(e, mes) {
  var doMes = comPendentes(e).filter(function (t) { return mesDe(t.data) === mes; });
  var gastos = doMes.filter(ehGasto);
  var r = {
    total: 0,
    pagou: { p1: 0, p2: 0 },
    custo: { p1: 0, p2: 0 },          // o que é de cada um de verdade: pessoal + sua parte do casal
    pessoal: { p1: 0, p2: 0 },
    casal: 0,
    entradas: { p1: 0, p2: 0 },
    categorias: [],
    maiores: [],
    quantidade: doMes.length
  };
  var porCat = {};
  gastos.forEach(function (t) {
    var p = pessoaDaConta(t.conta);
    r.total += t.valor;
    r.pagou[p] += t.valor;
    if (t.divisao === "casal") {
      r.casal += t.valor;
      r.custo.p1 += t.valor * pct(e, "p1");
      r.custo.p2 += t.valor * pct(e, "p2");
    } else {
      r.pessoal[p] += t.valor;
      r.custo[p] += t.valor;
    }
    var c = porCat[t.categoria] = porCat[t.categoria] || { id: t.categoria, total: 0, p1: 0, p2: 0 };
    c.total += t.valor; c[p] += t.valor;
  });
  doMes.forEach(function (t) {
    if (t.categoria === "entradas" && t.valor < 0) r.entradas[pessoaDaConta(t.conta)] += -t.valor;
  });
  e.categorias.forEach(function (c) {
    if (ESPECIAIS[c.id]) return;
    var x = porCat[c.id];
    if (x || c.orcamento > 0) {
      r.categorias.push({
        id: c.id, nome: c.nome, orcamento: Number(c.orcamento) || 0,
        total: arred(x ? x.total : 0), p1: arred(x ? x.p1 : 0), p2: arred(x ? x.p2 : 0)
      });
    }
  });
  r.categorias.sort(function (a, b) { return b.total - a.total; });
  r.maiores = gastos.slice().sort(function (a, b) { return b.valor - a.valor; }).slice(0, 8);
  ["total", "casal"].forEach(function (k) { r[k] = arred(r[k]); });
  ["pagou", "custo", "pessoal", "entradas"].forEach(function (k) {
    r[k].p1 = arred(r[k].p1); r[k].p2 = arred(r[k].p2);
  });
  return r;
}

/* ---------------------------------------------------------------- cartão

   As faturas são chamadas pelo mês do VENCIMENTO ("a fatura de novembro" é
   a que vence em novembro). De onde vem a fatura de cada compra, em ordem:
   1. o id da fatura no banco (Pluggy), casado com a lista de faturas;
   2. a previsão do banco (Open Finance: AAAA-MM), que vale até para futuras;
   3. a conta pelos dias de fechamento e vencimento: compra antes do dia de
      fechamento cai na fatura que fecha naquele mês; no dia ou depois, na
      do mês seguinte. Sem os dias, fica o mês da compra (estimativa). */

/* "Parcela 2/5", "PARC 02/10", "parc. 3 de 12" */
var RE_PARCELA = /(?:parcela|parc\.?)\s*0*(\d{1,2})\s*(?:\/|de)\s*0*(\d{1,2})/i;
function infoParcela(t) {
  var k = Number(t.parcela), n = Number(t.parcelas);
  if (n > 1 && k >= 1 && k <= n) return { k: k, n: n };
  var m = RE_PARCELA.exec(t.descricao || "");
  if (m) {
    k = Number(m[1]); n = Number(m[2]);
    if (n > 1 && k >= 1 && k <= n) return { k: k, n: n };
  }
  return null;
}
/* "Amazon - Parcela 3/10" e "Amazon - Parcela 4/10" são a mesma compra. */
/* A descrição sem a marca da parcela, para juntar as parcelas da mesma
   compra. Com k e n conhecidos (do banco), tira também o "02/10" solto. */
function baseParcela(descricao, k, n) {
  var d = String(descricao || "").replace(/[-–]?\s*(?:parcela|parc\.?)\s*\d{1,2}\s*(?:\/|de)\s*\d{1,2}/i, "");
  if (k && n) d = d.replace(new RegExp("\\b0*" + k + "\\s*(?:\\/|de)\\s*0*" + n + "\\b", "i"), "");
  return normalizar(d);
}

/* Os dados do cartão de uma pessoa: o que o banco mandou (Pluggy) mais os
   dias de fechamento/vencimento que vocês puseram em Configurar. */
function cartaoDe(e, p) {
  var banco = null;
  Object.keys(e.cartoes || {}).forEach(function (k) {
    var c = e.cartoes[k];
    if (c.pessoa === p && (!banco || String(c.atualizadoEm || "") > String(banco.atualizadoEm || ""))) banco = c;
  });
  var conf = e.pessoas[p] || {};
  var dia = function (iso) { return iso ? Number(String(iso).slice(8, 10)) : 0; };
  var fechamento = dia(banco && banco.fechamento) || Number(conf.diaFechamento) || 0;
  var vencimento = dia(banco && banco.vencimento) || Number(conf.diaVencimento) || 0;
  return { banco: banco, diaFechamento: fechamento, diaVencimento: vencimento };
}

/* Mês de vencimento da fatura em que cai uma compra feita na data d. */
function mesDaFatura(cartao, d) {
  var mes = mesDe(d);
  var F = cartao.diaFechamento, V = cartao.diaVencimento;
  if (!F) return mes;
  var fecha = Number(String(d).slice(8, 10)) < F ? mes : somarMes(mes, 1);
  return V && V <= F ? somarMes(fecha, 1) : fecha;
}

function faturaDa(cartao, t) {
  var bills = (cartao.banco && cartao.banco.faturas) || [];
  if (t.billId) {
    for (var i = 0; i < bills.length; i++)
      if (bills[i].id === t.billId && bills[i].vencimento) return mesDe(bills[i].vencimento);
  }
  if (t.fatura && /^\d{4}-\d{2}$/.test(t.fatura)) return t.fatura;
  return mesDaFatura(cartao, t.data);
}

/* Tudo o que a aba Cartão mostra de uma pessoa. hoje = "AAAA-MM-DD". */
/* Pagamento da fatura e afins não são compra: não entram na soma de
   fatura nenhuma (no Open Finance o pagamento da fatura fechada aparece
   como crédito na fatura seguinte - e a deixava negativa). */
function naoEhCompra(e, conta, x) {
  var v = Number(x.valor) || 0;
  var cat = x.categoria || categorizar(e, x.descricao, v, conta, x.categoriaPluggy).categoria;
  if (cat === "fora") return true;
  var d = normalizar(x.descricao);
  return v < 0 && /\bpagamento\b/.test(d) && !/\bestorno\b/.test(d);
}

function resumoCartao(e, p, hoje) {
  var cartao = cartaoDe(e, p), banco = cartao.banco;
  var conta = p + "-cartao";
  var doCartao = e.transacoes.filter(function (t) { return t.conta === conta && !naoEhCompra(e, conta, t); });
  var bills = ((banco && banco.faturas) || []).filter(function (b) { return b.vencimento; })
    .sort(function (a, b) { return a.vencimento < b.vencimento ? 1 : -1; });

  /* Fatura aberta (a "fatura atual" do app do banco):
     - com a lista de faturas fechadas, é a seguinte à última fechada;
     - senão, o vencimento informado pelo banco - que no Open Finance é o da
       fatura fechada quando ela já fechou e ainda não venceu;
     - sem banco, a de uma compra feita hoje. */
  var fechada = bills[0] || null, aberta;
  if (fechada) aberta = somarMes(mesDe(fechada.vencimento), 1);
  else if (banco && banco.vencimento)
    aberta = banco.fechamento && banco.fechamento <= hoje ? somarMes(mesDe(banco.vencimento), 1) : mesDe(banco.vencimento);
  else aberta = mesDaFatura(cartao, hoje);
  if (banco && banco.vencimento && mesDe(banco.vencimento) > aberta) aberta = mesDe(banco.vencimento);

  var porMes = {};
  function no(mes) {
    return porMes[mes] = porMes[mes] || { mes: mes, lancado: 0, parcelas: 0, previsto: 0, itens: [] };
  }
  var series = {};
  doCartao.forEach(function (t) {
    var mes = faturaDa(cartao, t);
    var m = no(mes);
    m.lancado += t.valor;
    m.itens.push({ descricao: t.descricao, valor: t.valor, data: t.data, tipo: "lancado" });
    var pc = infoParcela(t);
    if (pc) {
      // mesma compra = mesma loja, mesmo número de parcelas e valor parecido
      // (a última parcela costuma vir com centavos de diferença)
      var grupo = baseParcela(t.descricao, pc.k, pc.n) + "|" + pc.n, chave = null;
      Object.keys(series).forEach(function (c) {
        if (!chave && c.indexOf(grupo + "|") === 0 &&
            Math.abs(Math.abs(series[c].valor) - Math.abs(t.valor)) <= Math.max(1, Math.abs(t.valor) * 0.02)) chave = c;
      });
      if (!chave) chave = grupo + "|" + Object.keys(series).length;
      var s = series[chave] = series[chave] || { descricao: t.descricao, valor: t.valor, n: pc.n, vistas: {}, ultima: null };
      s.vistas[pc.k] = mes;
      if (!s.ultima || pc.k > s.ultima.k) { s.ultima = { k: pc.k, mes: mes }; s.descricao = t.descricao; }
    }
  });

  // o que o banco já prevê (compras pendentes e parcelas futuras, Open Finance)
  var previstasPorChave = {}, bancoPrevêParcelas = false;
  ((banco && banco.previstas) || []).forEach(function (x) {
    if (infoParcela(x)) bancoPrevêParcelas = true;
    if (naoEhCompra(e, conta, x)) return;
    var mes = x.fatura && /^\d{4}-\d{2}$/.test(x.fatura) ? x.fatura : mesDaFatura(cartao, x.data || hoje);
    if (mes < aberta) return;
    var m = no(mes);
    m.previsto += Number(x.valor) || 0;
    m.itens.push({ descricao: x.descricao, valor: Number(x.valor) || 0, data: x.data, tipo: "previsto" });
    var pc = infoParcela(x);
    if (pc) previstasPorChave[baseParcela(x.descricao, pc.k, pc.n) + "|" + pc.n + "|" + pc.k] = true;
  });

  // parcelas que ainda vão cair: k+1..n nos meses seguintes ao da última vista
  var parcelamentos = [];
  Object.keys(series).forEach(function (chave) {
    var s = series[chave], u = s.ultima, base = chave.split("|")[0];
    var restantes = 0;
    for (var j = u.k + 1; j <= s.n; j++) {
      // o banco já manda as parcelas futuras: as dele valem, nada de projetar
      // (a descrição às vezes muda entre parcelas e a mesma contaria duas vezes)
      if (bancoPrevêParcelas) break;
      if (s.vistas[j] || previstasPorChave[base + "|" + s.n + "|" + j]) continue;
      var mes = somarMes(u.mes, j - u.k);
      var m = no(mes);
      m.parcelas += s.valor;
      m.itens.push({ descricao: s.descricao.replace(/((?:parcela|parc\.?)\s*)\d{1,2}/i, "$1" + j), valor: s.valor, tipo: "parcela" });
      restantes++;
    }
    var termina = somarMes(u.mes, s.n - u.k);
    if (termina >= aberta) {
      parcelamentos.push({
        descricao: s.descricao.replace(/\s*[-–]?\s*(?:parcela|parc\.?)\s*\d{1,2}\s*(?:\/|de)\s*\d{1,2}/i, "")
          .replace(new RegExp("\\s*\\b0*" + u.k + "\\s*\\/\\s*0*" + s.n + "\\b"), "").trim(),
        k: u.k, n: s.n, valor: arred(s.valor), falta: arred(s.valor * (s.n - u.k)), termina: termina
      });
    }
  });
  // com as parcelas futuras vindas do banco, os parcelamentos saem delas:
  // a parcela da fatura aberta (ou a próxima), quanto falta e até quando
  if (bancoPrevêParcelas) {
    parcelamentos = [];
    var grupos = {};
    ((banco && banco.previstas) || []).forEach(function (x) {
      var pc = infoParcela(x);
      if (!pc || naoEhCompra(e, conta, x)) return;
      var mes = x.fatura && /^\d{4}-\d{2}$/.test(x.fatura) ? x.fatura : mesDaFatura(cartao, x.data || hoje);
      if (mes < aberta) return;
      var v = Number(x.valor) || 0, base = baseParcela(x.descricao, pc.k, pc.n) + "|" + pc.n, chave = null;
      Object.keys(grupos).forEach(function (c) {
        if (!chave && c.indexOf(base + "|") === 0 && Math.abs(grupos[c].valor - v) <= Math.max(1, v * 0.02)) chave = c;
      });
      if (!chave) chave = base + "|" + Object.keys(grupos).length;
      var g = grupos[chave] = grupos[chave] || { descricao: x.descricao, valor: v, n: pc.n, k: pc.k, falta: 0, termina: mes };
      g.falta += v;
      if (pc.k < g.k) { g.k = pc.k; g.descricao = x.descricao; }
      if (mes > g.termina) g.termina = mes;
    });
    Object.keys(grupos).forEach(function (c) {
      var g = grupos[c];
      parcelamentos.push({
        descricao: g.descricao.replace(/\s*[-–]?\s*(?:parcela|parc\.?)\s*\d{1,2}\s*(?:\/|de)\s*\d{1,2}/i, "")
          .replace(new RegExp("\\s*\\b0*" + g.k + "\\s*\\/\\s*0*" + g.n + "\\b"), "").trim(),
        k: g.k, n: g.n, valor: arred(g.valor), falta: arred(g.falta), termina: g.termina
      });
    });
  }
  parcelamentos.sort(function (a, b) { return a.termina < b.termina ? 1 : a.termina > b.termina ? -1 : b.falta - a.falta; });

  var meses = [];
  for (var i = 0; i < 6; i++) {
    var mes = somarMes(aberta, i), x = porMes[mes] || { mes: mes, lancado: 0, parcelas: 0, previsto: 0, itens: [] };
    meses.push({
      mes: mes, lancado: arred(x.lancado), parcelas: arred(x.parcelas), previsto: arred(x.previsto),
      total: arred(x.lancado + x.parcelas + x.previsto), itens: x.itens
    });
  }

  // faturas anteriores: as do banco (menos a fechada, que vai à parte);
  // sem banco, a soma das compras
  var anteriores = [];
  if (bills.length) {
    bills.forEach(function (b) {
      if (b !== fechada && mesDe(b.vencimento) < aberta)
        anteriores.push({ mes: mesDe(b.vencimento), total: arred(Number(b.total) || 0), vencimento: b.vencimento, fonte: "banco" });
    });
  } else {
    Object.keys(porMes).forEach(function (mes) {
      if (mes < aberta && porMes[mes].lancado) anteriores.push({ mes: mes, total: arred(porMes[mes].lancado), fonte: "compras" });
    });
  }
  anteriores.sort(function (a, b) { return a.mes < b.mes ? 1 : -1; });

  var info = null;
  if (banco) {
    var limite = Number(banco.limite), disp = Number(banco.disponivel), usado = Number(banco.usado);
    var temLim = isFinite(limite) && banco.limite != null, temUsado = isFinite(usado) && banco.usado != null;
    // o "disponível" do Open Finance pode vir furado (Nubank: R$ 42,68 com
    // ~R$ 7,7 mil livres); o usado vem certo, e limite - usado é o livre
    if (temLim && temUsado) disp = limite - usado;
    info = {
      limite: temLim ? limite : null,
      disponivel: isFinite(disp) && (banco.disponivel != null || temUsado) ? arred(disp) : null,
      usado: temUsado ? usado : null,
      bandeira: banco.bandeira || "", nome: banco.nome || "", atualizadoEm: banco.atualizadoEm || null
    };
  }

  // a fatura fechada mais recente: valor do banco, mínimo e se já foi paga
  var fechadaInfo = null;
  if (fechada) {
    var total = Number(fechada.total) || 0;
    var pago = fechada.pago != null ? Number(fechada.pago) : null;
    if (pago == null || pago < total - 0.01) {
      // sem a lista de pagamentos: procura o crédito do pagamento depois do fechamento
      var depois = (fechada.fechamento || fechada.vencimento);
      var pagamentos = e.transacoes.filter(function (t) { return t.conta === conta && t.data >= depois; })
        .concat(((banco && banco.previstas) || []))
        .filter(function (x) { return Number(x.valor) < 0 && naoEhCompra(e, conta, x); });
      var soma = pagamentos.reduce(function (a, x) { return a - Number(x.valor); }, 0);
      if (pago == null || soma > pago) pago = soma;
    }
    fechadaInfo = {
      vencimento: fechada.vencimento, fechamento: fechada.fechamento || null, total: arred(total),
      minimo: fechada.minimo != null ? Number(fechada.minimo) : (banco && banco.vencimento === fechada.vencimento && banco.minimo != null ? Number(banco.minimo) : null),
      pago: arred(pago || 0), paga: (pago || 0) >= total - 0.01
    };
  }
  // datas da fatura aberta: o mesmo dia de fechamento e vencimento, um mês depois
  var abertaFecha = null, abertaVence = null;
  var diaF = fechada && fechada.fechamento ? fechada.fechamento.slice(8, 10) : (cartao.diaFechamento ? ("0" + cartao.diaFechamento).slice(-2) : null);
  var diaV = fechada ? fechada.vencimento.slice(8, 10) : (cartao.diaVencimento ? ("0" + cartao.diaVencimento).slice(-2) : null);
  if (diaV) abertaVence = aberta + "-" + diaV;
  if (diaF && diaV) abertaFecha = (Number(diaF) < Number(diaV) ? aberta : somarMes(aberta, -1)) + "-" + diaF;
  return {
    temDados: doCartao.length > 0 || !!banco,
    aberta: aberta, info: info, fechada: fechadaInfo, abertaFecha: abertaFecha, abertaVence: abertaVence,
    diaFechamento: cartao.diaFechamento, diaVencimento: cartao.diaVencimento,
    estimado: !banco && !cartao.diaFechamento,
    meses: meses, parcelamentos: parcelamentos.slice(0, 50), anteriores: anteriores.slice(0, 6)
  };
}

function somarMes(mes, delta) {
  var a = Number(mes.slice(0, 4)), m = Number(mes.slice(5, 7)) - 1 + delta;
  a += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return a + "-" + ("0" + (m + 1)).slice(-2);
}

function serieMeses(e, mesFim, n) {
  var out = [];
  for (var i = n - 1; i >= 0; i--) {
    var mes = somarMes(mesFim, -i);
    var x = { mes: mes, p1: 0, p2: 0, total: 0 };
    comPendentes(e).forEach(function (t) {
      if (mesDe(t.data) !== mes || !ehGasto(t)) return;
      x[pessoaDaConta(t.conta)] += t.valor; x.total += t.valor;
    });
    x.p1 = arred(x.p1); x.p2 = arred(x.p2); x.total = arred(x.total);
    out.push(x);
  }
  return out;
}

/* Um termo razoável para virar regra a partir de uma descrição:
   "Compra no débito - PADARIA REAL 123" -> "padaria real" */
function sugerirTermo(descricao) {
  var d = normalizar(descricao)
    .replace(/^(compra no debito|compra no credito|transferencia enviada pelo pix|transferencia enviada|pagamento de boleto efetuado|pagamento efetuado|debito automatico|pix enviado)\s*/, "")
    .replace(/\bparcela\s+\d+\s+\d+\b/, "")
    .replace(/\b\d+\b/g, " ")
    .replace(/\s+/g, " ").trim();
  var palavras = d.split(" ").filter(function (w) { return w.length >= 2; });
  return palavras.slice(0, 2).join(" ");
}

/* Só para mostrar: tira o prefixo e o CPF/banco que o extrato põe.
   "Transferência enviada pelo Pix - FULANO - •••.123 - BANCO" -> "Pix para FULANO" */
function descricaoCurta(descricao) {
  var d = String(descricao || "");
  var m = /^(transfer[êe]ncia (enviada|recebida) pelo pix|pagamento de boleto efetuado|compra no d[ée]bito|compra no cr[ée]dito)\s+-\s+(.+)$/i.exec(d);
  if (!m) return d;
  if (!m[2]) return m[3];
  return (/recebida/i.test(m[2]) ? "Pix de " : "Pix para ") + m[3].split(" - ")[0];
}

var Nucleo = {
