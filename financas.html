        (dif > 0 ? '<span class="acima">' + brl(dif) + " acima</span>." : brl(-dif) + " abaixo, dentro do ritmo.") + "</p>";
    }
    h += '<p class="orc-total">Total do mês, com todas as categorias: <strong class="num">' + brl(r.total) + "</strong></p>";
  } else {
    h += '<div class="orc-valor">' + brl(r.total) + "</div>";
    h += '<p class="orc-frase"><span>gastos em ' + MESES[m - 1] + "</span>";
    if (ant.total > 0) {
      var dp = (r.total - ant.total) / ant.total * 100;
      h += '<span class="delta">' + ic(dp > 0 ? "sobe" : "desce", "ic-p") + Math.abs(dp).toFixed(0) + "% " +
        (dp > 0 ? "a mais" : "a menos") + " que " + MESES[Number(mesAnt.slice(5, 7)) - 1] + "</span>";
    }
    h += "</p>";
    h += '<p class="ritmo-frase">Sem orçamento ainda. Ponha um limite nas categorias em <a href="#" data-ir="config">Configurar</a> para ver o ritmo do mês.</p>';
  }
  h += "</div>";

  /* A folha */
  h += '<div class="folha"><div class="folha-sem" aria-hidden="true"><div>D</div><div>S</div><div>T</div><div>Q</div><div>Q</div><div>S</div><div>S</div></div>';
  h += '<div class="folha-dias">';
  var vazias = new Date(ano, m - 1, 1).getDay();
  for (var v = 0; v < vazias; v++) h += '<div class="dia-fora" aria-hidden="true"></div>';
  for (var d = 1; d <= nDias; d++) {
    var x = dias[d], futuro = d > decorridos && !x;
    var feriado = feriadosMes[mesAtual.slice(5, 7) + "-" + ("0" + d).slice(-2)];
    var acima = !!(x && orcamento > 0 && x.orcado > ritmoDia);
    var cls = "dia" + (futuro ? " futuro" : "") + (acima ? " acima" : "") + (feriado ? " feriado" : "") +
      (mesAtual === mesHoje && d === decorridos ? " hoje" : "");
    var rotulo = d + " de " + MESES[m - 1] + (feriado ? ", " + feriado : "") + ": " + (x ? brl(x.total) : "nada") +
      (acima ? ", acima do ritmo" : "") + (mesAtual === mesHoje && d === decorridos ? " (hoje)" : "");
    h += '<button class="' + cls + '" data-dia="' + d + '" aria-pressed="' + (diaEscolhido.dia === d) + '" aria-label="' + esc(rotulo) + '"' +
      (feriado ? ' data-dica="' + esc(feriado) + '"' : "") + (futuro && !feriado ? " disabled" : "") + ">" +
      '<span class="dia-n">' + d + "</span>" +
      (feriado ? '<span class="dia-f">' + esc(FERIADO_CURTO[feriado] || feriado) + "</span>" : "") +
      (x ? '<span class="dia-v">' + valorCasa(x.total) + "</span>" : "");
    if (x && x.total > 0) {
      h += '<span class="dia-barra">' +
        (x.p1 > 0 ? '<span class="b-p1" style="flex:' + x.p1 + '"></span>' : "") +
        (x.p2 > 0 ? '<span class="b-p2" style="flex:' + x.p2 + '"></span>' : "") + "</span>";
    }
    h += "</button>";
  }
  var resto = (7 - (vazias + nDias) % 7) % 7;
  for (var f = 0; f < resto; f++) h += '<div class="dia-fora" aria-hidden="true"></div>';
  h += "</div></div>";
  h += '<div class="folha-nota"><span>Gasto do dia, em reais.' +
    (orcamento > 0 ? " Em vermelho, os dias em que as categorias com orçamento passaram de " + brl(ritmoDia) + ", o ritmo diário." : "") +
    " Nome pequeno na casa: feriado nacional.</span>" + legenda("quem pagou") + "</div>";
  h += '<div class="dia-detalhe" id="dia-detalhe"></div>';

  /* Maiores gastos */
  h += '<section class="bloco"><h2 class="bloco-titulo">Maiores gastos do mês</h2><ul class="lista-simples lista-topo">';
  r.maiores.forEach(function (t) {
    var pp = N.pessoaDaConta(t.conta);
    h += '<li><span class="desc-curta" title="' + esc(t.descricao) + '">' + bolinha(pp) + esc(N.descricaoCurta(t.descricao)) +
      ' <span class="mudo">· ' + esc(nome(pp)) + " · " + dataBR(t.data) + '</span></span><span class="num">' + brl(t.valor) + "</span></li>";
  });
  if (!r.maiores.length) h += '<li class="sub">Nada neste mês.</li>';
  h += "</ul></section>";
  h += "</div>";

  /* Coluna da direita */
  h += "<div>";

  /* Categorias */
  h += '<section class="bloco"><h2 class="bloco-titulo">Por categoria</h2>';
  if (!r.categorias.length) h += '<p class="vazio-curto">Nada gasto neste mês.</p>';
  var maxCat = 0;
  r.categorias.forEach(function (c) { maxCat = Math.max(maxCat, c.total, c.orcamento); });
  r.categorias.forEach(function (c) {
    var w1 = maxCat ? c.p1 / maxCat * 100 : 0, w2 = maxCat ? c.p2 / maxCat * 100 : 0;
    var dc = c.nome + "\n" + nome("p1") + ": " + brl(c.p1) + "\n" + nome("p2") + ": " + brl(c.p2) +
      (c.orcamento ? "\nOrçamento: " + brl(c.orcamento) : "");
    h += '<div class="cat-linha" data-dica="' + esc(dc) + '">' +
      '<div class="cat-nome">' + esc(c.nome) + "</div>" +
      '<div class="cat-valor">' + brl(c.total) + "</div>" +
      '<div class="cat-trilho"><div class="cat-barra">' +
      (c.p1 > 0 ? '<div class="b-p1" style="width:' + w1 + '%"></div>' : "") +
      (c.p2 > 0 ? '<div class="b-p2" style="width:' + w2 + '%"></div>' : "") +
      "</div>" +
      (c.orcamento ? '<div class="cat-meta" style="left:' + (c.orcamento / maxCat * 100) + '%"></div>' : "") +
      "</div>";
    if (c.orcamento) {
      var p = c.total / c.orcamento * 100, acimaCat = c.total > c.orcamento;
      h += '<div class="cat-orc' + (acimaCat ? " acima" : "") + '">' +
        (acimaCat ? ic("alerta", "ic-p") + brl(c.total - c.orcamento) + " acima do orçamento de " + brl(c.orcamento)
                  : Math.round(p) + "% do orçamento de " + brl(c.orcamento) + " · sobram " + brl(c.orcamento - c.total)) +
        "</div>";
    }
    h += "</div>";
  });
  h += '<div class="legenda" style="margin-top:10px">' + legendaItens() + '<span class="mudo">barra: quem pagou · traço: orçamento</span></div>';
  h += "</section>";

  /* Quanto é de cada um */
  h += '<section class="bloco"><h2 class="bloco-titulo">Cada um<small>pessoal + a sua parte do casal</small></h2><div class="pessoas-res">';
  ["p1", "p2"].forEach(function (p) {
    h += '<div class="pessoa-res"><div class="pessoa-nome">' + bolinha(p) + esc(nome(p)) + "</div>" +
      '<div class="pessoa-valor">' + brl(r.custo[p]) + "</div>" +
      '<div class="pessoa-det">pessoal ' + brl(r.pessoal[p]) + "<br>parte do casal " + brl(r.custo[p] - r.pessoal[p]) +
      "<br>saiu da conta/cartão " + brl(r.pagou[p]) +
      (r.entradas[p] ? '<br><span class="entrou">entrou ' + brl(r.entradas[p]) + "</span>" : "") + "</div></div>";
  });
  h += "</div>";
  h += '<div class="casal-linha"><span>Despesas do casal <strong class="num">' + brl(r.casal) + "</strong></span>" +
    '<span class="sub">' + Math.round(N.pct(estado, "p1") * 100) + "% " + esc(nome("p1")) + " · " +
    Math.round(N.pct(estado, "p2") * 100) + "% " + esc(nome("p2")) + "</span></div>";
  h += "</section>";

  /* Últimos 6 meses */
  var maxM = 0;
  serie.forEach(function (s) { maxM = Math.max(maxM, s.total); });
  h += '<section class="bloco"><h2 class="bloco-titulo">Últimos 6 meses' + '<small>' + legendaTexto() + "</small></h2>";
  h += '<div class="colunas">';
  serie.forEach(function (s) {
    var ds = nomeMes(s.mes) + "\nTotal: " + brl(s.total) + "\n" + nome("p1") + ": " + brl(s.p1) + "\n" + nome("p2") + ": " + brl(s.p2);
    h += '<div class="coluna' + (s.mes === mesAtual ? " atual" : "") + '" data-dica="' + esc(ds) + '">' +
      (s.p1 > 0 ? '<div class="b-p1" style="height:' + (maxM ? s.p1 / maxM * 100 : 0) + '%"></div>' : "") +
      (s.p2 > 0 ? '<div class="b-p2" style="height:' + (maxM ? s.p2 / maxM * 100 : 0) + '%"></div>' : "") +
      "</div>";
  });
  h += '</div><div class="col-rotulos">';
  serie.forEach(function (s) {
    h += '<div class="' + (s.mes === mesAtual ? "atual-rotulo" : "") + '">' + MESES_CURTOS[Number(s.mes.slice(5, 7)) - 1] + "<br>" + (s.total ? brlCurto(s.total) : "–") + "</div>";
  });
  h += "</div></section>";


  var cx = textoConexoes();
  var pend = N.comPendentes(estado).filter(function (t) { return t.pendente && N.mesDe(t.data) === mesAtual; }).length;
  if (cx || pend) {
    h += '<p class="nota" style="margin-top:20px">' + cx +
      (pend ? (cx ? "<br>" : "") + "Inclui " + pend + " transaç" + (pend === 1 ? "ão pendente" : "ões pendentes") +
        " (o banco ainda não fechou; aparecem marcadas em Transações)." : "") + "</p>";
  }
  h += "</div></div>";

  el.innerHTML = h;
  ligarLinks(el);
  $$(".dia[data-dia]", el).forEach(function (b) {
    b.addEventListener("click", function () {
      var d2 = Number(b.dataset.dia);
      diaEscolhido = { mes: mesAtual, dia: diaEscolhido.dia === d2 ? 0 : d2 };
      $$(".dia[data-dia]", el).forEach(function (o) { o.setAttribute("aria-pressed", String(Number(o.dataset.dia) === diaEscolhido.dia)); });
      desenharDia(dias);
    });
  });
  desenharDia(dias);
}

/* O que saiu no dia tocado na folha */
function desenharDia(dias) {
  var alvo = $("#dia-detalhe");
  if (!alvo) return;
  var d = diaEscolhido.dia;
  if (!d) { alvo.innerHTML = '<p class="nota">Toque num dia da folha para ver o que saiu nele.</p>'; return; }
  var ano = Number(mesAtual.slice(0, 4)), m = Number(mesAtual.slice(5, 7));
  var x = dias[d];
  var feriado = feriados(ano)[mesAtual.slice(5, 7) + "-" + ("0" + d).slice(-2)];
  var h = '<div class="cab-dia"><h3>' + DIAS_SEMANA[new Date(ano, m - 1, d).getDay()] + ", " + d + " de " + MESES[m - 1] +
    (feriado ? ' <span class="mudo">· ' + esc(feriado) + "</span>" : "") + "</h3>" +
    '<span class="num">' + (x ? brl(x.total) : "") + "</span></div>";
  if (!x) h += '<p class="vazio-curto">' + (mesAtual + "-" + ("0" + d).slice(-2) > hojeISO() ? "Ainda não chegou." : "Nada saiu neste dia.") + "</p>";
  else {
    h += '<ul class="lista-simples">';
    x.itens.slice().sort(function (a, b) { return b.valor - a.valor; }).forEach(function (t) {
      var p = N.pessoaDaConta(t.conta), c = N.categoria(estado, t.categoria);
      h += '<li><span class="desc-curta" title="' + esc(t.descricao) + '">' + bolinha(p) +
        (t.pendente ? '<span class="etiqueta">pendente</span>' : "") + esc(N.descricaoCurta(t.descricao)) +
        ' <span class="mudo">· ' + esc(nome(p)) + " · " + esc(c ? c.nome : t.categoria) + "</span></span>" +
        '<span class="num">' + brl(t.valor) + "</span></li>";
    });
    h += "</ul>";
  }
  alvo.innerHTML = h;
}

/* "o Pluggy buscou no banco em 10/10 08:15 · próxima: 11/10 08:15" */
function horaCurta(iso) {
  if (!iso) return "";
  var d = new Date(iso);
  if (isNaN(d)) return "";
  return ("0" + d.getDate()).slice(-2) + "/" + ("0" + (d.getMonth() + 1)).slice(-2) + " " +
    ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
}
function textoConexoes() {
  var partes = [];
  ["p1", "p2"].forEach(function (p) {
    var c = estado.conexoes[p];
    if (!c) return;
    var t = esc(nome(p)) + ": dados do banco até " + (horaCurta(c.sincronizado) || "?");
    t += c.proxima ? " (o Pluggy atualiza de novo em " + horaCurta(c.proxima) + ")" : " (sem atualização automática no Pluggy — confira em meu.pluggy.ai)";
    partes.push(t);
  });
  return partes.join("<br>");
}

function legendaItens() {
  return "<span>" + bolinha("p1") + esc(nome("p1")) + "</span><span>" + bolinha("p2") + esc(nome("p2")) + "</span>";
}
function legenda(sufixo) {
  return '<div class="legenda">' + legendaItens() + '<span class="mudo">' + sufixo + "</span></div>";
}
/* A mesma legenda dentro de um título */
function legendaTexto() {
  return '<span class="legenda" style="display:inline-flex">' + legendaItens() + "</span>";
}
function ligarLinks(el) {
  $$("[data-ir]", el).forEach(function (a) {
    a.addEventListener("click", function (ev) { ev.preventDefault(); trocarAba(a.dataset.ir); });
  });
}

/* ============================================================ TRANSAÇÕES */
function desenharTransacoes() {
  var el = $("#painel-transacoes");
  var h = '<div class="filtros">' +
    '<input type="search" id="f-busca" placeholder="Buscar descrição…" value="' + esc(filtro.busca) + '">' +
    '<select id="f-pessoa"><option value="">Os dois</option>' +
    '<option value="p1">' + esc(nome("p1")) + '</option><option value="p2">' + esc(nome("p2")) + "</option></select>" +
    '<select id="f-cat"><option value="">Todas as categorias</option>' + opcoesCategoria("") + "</select>" +
    '<select id="f-div"><option value="">Pessoal e casal</option><option value="casal">Só do casal</option><option value="pessoal">Só pessoais</option></select>' +
    '<label class="sub"><input type="checkbox" id="f-todos"' + (filtro.todos ? " checked" : "") + "> todos os meses</label>" +
    '<button class="botao primario" id="nova-tx">' + ic("mais") + "Lançar à mão</button>" +
    "</div>";
  h += '<div id="form-nova"></div>';
  h += '<div class="tx-cab" aria-hidden="true"><div>Descrição</div><div>Quem</div><div>Categoria</div><div>Divisão</div><div style="text-align:right">Valor</div><div></div></div>';
  h += '<div id="lista-tx"></div>';
  el.innerHTML = h;

  $("#f-pessoa").value = filtro.pessoa;
  $("#f-cat").value = filtro.categoria;
  $("#f-div").value = filtro.divisao;
  $("#f-busca").addEventListener("input", function () { filtro.busca = this.value; desenharLista(); });
  $("#f-pessoa").addEventListener("change", function () { filtro.pessoa = this.value; desenharLista(); });
  $("#f-cat").addEventListener("change", function () { filtro.categoria = this.value; desenharLista(); });
  $("#f-div").addEventListener("change", function () { filtro.divisao = this.value; desenharLista(); });
  $("#f-todos").addEventListener("change", function () { filtro.todos = this.checked; desenharLista(); });
  $("#nova-tx").addEventListener("click", formNova);
  desenharLista();
}

function opcoesCategoria(sel) {
  return estado.categorias.map(function (c) {
    return '<option value="' + esc(c.id) + '"' + (c.id === sel ? " selected" : "") + ">" + esc(c.nome) + "</option>";
  }).join("");
}

function desenharLista() {
  var busca = N.normalizar(filtro.busca);
  var lista = N.comPendentes(estado).filter(function (t) {
    if (!filtro.todos && N.mesDe(t.data) !== mesAtual) return false;
    if (filtro.pessoa && N.pessoaDaConta(t.conta) !== filtro.pessoa) return false;
    if (filtro.categoria && t.categoria !== filtro.categoria) return false;
    if (filtro.divisao && (t.divisao !== filtro.divisao || !N.ehGasto(t))) return false;
    if (busca && N.normalizar(t.descricao).indexOf(busca) === -1) return false;
    return true;
  });
  lista.sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
  var LIMITE = 500;
  var h = "", soma = 0, porDia = {}, diaAtual = "";
  lista.forEach(function (t) {
    if (!N.ehGasto(t)) return;
    soma += t.valor;
    porDia[t.data] = (porDia[t.data] || 0) + t.valor;
  });
  lista.slice(0, LIMITE).forEach(function (t) {
    var p = N.pessoaDaConta(t.conta), gasto = N.ehGasto(t);
    if (t.data !== diaAtual) {
      // cabeçalho de folhinha a cada dia: número grande e o dia da semana
      diaAtual = t.data;
      var dt = new Date(Number(t.data.slice(0, 4)), Number(t.data.slice(5, 7)) - 1, Number(t.data.slice(8, 10)));
      var fer = feriados(dt.getFullYear())[t.data.slice(5, 10)];
      h += '<div class="tx-dia"><div class="mini-folha peq" aria-hidden="true"><div class="mf-cab">' + MESES_CURTOS[dt.getMonth()] + "</div>" +
        '<div class="mf-n">' + dt.getDate() + "</div></div>" +
        '<span class="tx-dia-s">' + DIAS_SEMANA[dt.getDay()] + ", " + dt.getDate() + " de " + MESES[dt.getMonth()] +
        (filtro.todos || t.data.slice(0, 7) !== mesAtual ? " de " + t.data.slice(0, 4) : "") +
        (fer ? "<small>" + esc(fer) + "</small>" : "") + "</span>" +
        (porDia[t.data] ? '<span class="tx-dia-t">' + brl(porDia[t.data]) + "</span>" : "") + "</div>";
    }
    var cls = !gasto ? (t.categoria === "entradas" ? "entrada" : "fora") : "";
    if (t.pendente) {
      // ainda não fechou no banco: aparece e soma, mas não edita - a edição
      // se perderia quando ela fechar e voltar como transação definitiva
      var cat = N.categoria(estado, t.categoria);
      h += '<div class="tx pendente" data-id="' + esc(t.id) + '">' +
        '<div class="tx-desc" title="' + esc(t.descricao) + '"><span class="etiqueta" data-dica="O banco ainda não fechou esta transação. Quando fechar, ela aparece aqui como definitiva e dá para editar.">pendente</span>' +
        esc(N.descricaoCurta(t.descricao)) + "</div>" +
        '<div class="quem">' + bolinha(p) + esc(nome(p)) + " · " + esc(N.TIPOS_CONTA[N.tipoDaConta(t.conta)] || "") + "</div>" +
        '<div class="tx-texto">' + esc(cat ? cat.nome : t.categoria) + "</div>" +
        '<div class="tx-texto">' + (gasto ? (t.divisao === "casal" ? "Do casal" : "Só de " + esc(nome(p))) : "fora da conta") + "</div>" +
        '<div class="valor ' + cls + '">' + (t.valor < 0 ? "+ " + brl(-t.valor) : brl(t.valor)) + "</div><div></div></div>";
      return;
    }
    h += '<div class="tx" data-id="' + esc(t.id) + '">' +
      '<div class="tx-desc" title="' + esc(t.descricao) + '">' + esc(N.descricaoCurta(t.descricao)) + "</div>" +
      '<div class="quem">' + bolinha(p) + esc(nome(p)) + " · " + esc(N.TIPOS_CONTA[N.tipoDaConta(t.conta)] || "") + "</div>" +
      '<div><select data-campo="categoria" aria-label="Categoria">' + opcoesCategoria(t.categoria) + "</select></div>" +
      "<div>" + (gasto
        ? '<select data-campo="divisao" aria-label="Divisão"><option value="pessoal"' + (t.divisao === "pessoal" ? " selected" : "") + ">Só de " + esc(nome(p)) + '</option><option value="casal"' + (t.divisao === "casal" ? " selected" : "") + ">Do casal</option></select>"
        : '<span class="tx-texto">fora da conta</span>') + "</div>" +
      '<div class="valor ' + cls + '">' + (t.valor < 0 ? "+ " + brl(-t.valor) : brl(t.valor)) + "</div>" +
      '<div><button class="botao-x" data-apagar aria-label="Apagar" title="Apagar">' + ic("x") + "</button></div>" +
      "</div>";
  });
  if (!lista.length) h = '<div class="vazio-lista">Nenhuma transação ' + (filtro.todos ? "com esses filtros." : "em " + nomeMes(mesAtual) + " com esses filtros.") + "</div>";
  if (lista.length > LIMITE) h += '<div class="sub" style="padding:12px 4px">Mostrando ' + LIMITE + " de " + lista.length + ". Use a busca ou os filtros para achar o resto.</div>";
  h += '<div class="tx-total"><span>' + lista.length + " transaç" + (lista.length === 1 ? "ão" : "ões") + '</span><span class="num">Gastos: ' + brl(soma) + "</span></div>";
  var el = $("#lista-tx");
  el.innerHTML = h;

  $$("select[data-campo]", el).forEach(function (s) {
    s.addEventListener("change", function () {
      var id = s.closest(".tx").dataset.id;
      var t = estado.transacoes.filter(function (x) { return x.id === id; })[0];
      if (!t) return;
      t[s.dataset.campo] = s.value;
      if (s.dataset.campo === "categoria") {
        var c = N.categoria(estado, s.value);
        if (N.ehGasto(t) && !t.manualDivisao) t.divisao = c && c.casal ? "casal" : "pessoal";
      } else t.manualDivisao = true;
      t.manual = true;
      t.alterado = Date.now();
      salvar();
      desenharLista();
      if (s.dataset.campo === "categoria") oferecerRegra(t);
    });
  });
  $$("[data-apagar]", el).forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.closest(".tx").dataset.id;
      var t = estado.transacoes.filter(function (x) { return x.id === id; })[0];
      if (!t || !confirm('Apagar "' + t.descricao + '" (' + brl(t.valor) + ")?\n\nEla some para os dois e não volta nem se o arquivo for importado de novo.")) return;
      N.apagar(estado, id);
      salvar(); desenharLista();
    });
  });
}

/* Depois de trocar a categoria de uma transação, propõe virar regra. */
function oferecerRegra(t) {
  var termo = N.sugerirTermo(t.descricao);
  if (!termo) return;
  var c = N.categoria(estado, t.categoria);
  var caixa = document.createElement("span");
  caixa.style.display = "contents";
  caixa.innerHTML = '<span>Sempre que aparecer</span><input type="text" value="' + esc(termo) + '">' +
    "<span>→ " + esc(c ? c.nome : t.categoria) + "?</span><button>Criar regra</button><button>Não</button>";
  var bts = caixa.querySelectorAll("button");
  bts[0].addEventListener("click", function () {
    var termo2 = N.normalizar(caixa.querySelector("input").value);
    if (!termo2) return;
    estado.regras = estado.regras.filter(function (r) { return N.normalizar(r.termo) !== termo2; });
    estado.regras.push({ termo: termo2, categoria: t.categoria, divisao: "" });
    var n = N.reaplicarRegras(estado);
    salvarConfig();
    brinde("Regra criada" + (n ? " e aplicada em mais " + n + " transaç" + (n === 1 ? "ão" : "ões") : "") + ".");
    desenhar();
  });
  bts[1].addEventListener("click", function () { $("#brinde").style.display = "none"; });
  brinde(caixa, 12000);
}

function formNova() {
  var el = $("#form-nova");
  if (el.innerHTML) { el.innerHTML = ""; return; }
  var hojeStr = new Date().toISOString().slice(0, 10);
  el.innerHTML = '<div class="linha-form" style="margin:4px 0 14px">' +
    '<input type="date" id="n-data" value="' + hojeStr + '">' +
    '<input type="text" id="n-desc" placeholder="Descrição" style="flex:1 1 180px">' +
    '<input type="text" id="n-valor" placeholder="Valor (ex.: 35,90)" inputmode="decimal" style="width:130px">' +
    '<select id="n-pessoa"><option value="p1">' + esc(nome("p1")) + '</option><option value="p2">' + esc(nome("p2")) + "</option></select>" +
    '<select id="n-tipo"><option value="outro">Dinheiro/outro</option><option value="cartao">Cartão</option><option value="conta">Conta</option></select>' +
    '<button class="botao primario" id="n-ok">Lançar</button></div>';
  $("#n-desc").focus();
  $("#n-ok").addEventListener("click", function () {
    var v = N.lerValor($("#n-valor").value), d = $("#n-desc").value.trim(), data = $("#n-data").value;
    if (!d || isNaN(v) || !data) { brinde("Preencha data, descrição e valor."); return; }
    var conta = $("#n-pessoa").value + "-" + $("#n-tipo").value;
    N.importar(estado, conta, [{ id: "m-" + Date.now().toString(36), data: data, descricao: d, valor: v }], "manual");
    salvar();
    el.innerHTML = "";
    mesAtual = N.mesDe(data);
    desenhar();
    brinde("Lançado.");
  });
}

function hojeISO() {
  var d = new Date();
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2);
}
function mesCurto(m) { return MESES_CURTOS[Number(m.slice(5, 7)) - 1] + "/" + m.slice(2, 4); }

function desenharCartao() {
  var el = $("#painel-cartao");
  var hoje = hojeISO();
  var h = '<div class="cartao-grade">';
  ["p1", "p2"].forEach(function (p) {
    var r = N.resumoCartao(estado, p, hoje);
    h += "<section>";
    h += '<h2 class="cartao-cab"><span class="nome">' + bolinha(p) + esc(nome(p)) + "</span>" +
      (r.info && (r.info.nome || r.info.bandeira) ? ' <span class="mudo">' + esc([r.info.nome, r.info.bandeira].filter(Boolean).join(" · ")) + "</span>" : "") + "</h2>";
    if (!r.temDados) {
      h += '<p class="sem-dados">Ainda sem dados do cartão de ' + esc(nome(p)) + '. Importe a fatura (CSV) em ' +
        '<a href="#" data-ir="importar">Importar</a>, ou conecte o Meu Pluggy com o cartão incluído.</p></section>';
      return;
    }

    // limite
    if (r.info && r.info.limite) {
      var disp = r.info.disponivel != null ? r.info.disponivel : null;
      var usado = r.info.usado != null ? r.info.usado : disp != null ? r.info.limite - disp : null;
      var pc = usado != null ? Math.max(0, Math.min(100, usado / r.info.limite * 100)) : 0;
      h += '<div class="limite"><div class="fatura-rotulo">Limite</div>' +
        '<div class="limite-trilho" data-dica="Usado ' + esc(brl(usado)) + " de " + esc(brl(r.info.limite)) + '">' +
        '<div class="limite-uso b-' + p + '" style="width:' + pc + '%"></div></div>' +
        '<div class="sub">usado <strong>' + brl(usado) + "</strong> de " + brl(r.info.limite) +
        (disp != null ? " · disponível <strong>" + brl(disp) + "</strong>" : "") + "</div></div>";
    }

    // fatura atual (aberta); fechamento e vencimento como folhinhas pequenas
    var atual = r.meses[0];
    var datas = "";
    function miniFolha(rotulo, data, dia) {
      if (!data && !dia) return "";
      return '<div class="mini-folha" aria-label="' + rotulo + " " + (data ? dataBR(data) : "dia " + dia) + '">' +
        '<div class="mf-cab">' + rotulo + '</div><div class="mf-n">' + (data ? Number(data.slice(8, 10)) : dia) + "</div>" +
        '<div class="mf-m">' + (data ? MESES_CURTOS[Number(data.slice(5, 7)) - 1] : "todo mês") + "</div></div>";
    }
    datas = miniFolha("fecha", r.abertaFecha, r.diaFechamento) + miniFolha("vence", r.abertaVence, r.diaVencimento);
    h += '<div class="fatura-rotulo">Fatura atual (aberta) · ' + MESES[Number(r.aberta.slice(5, 7)) - 1] + "</div>";
    h += '<div class="fatura-atual"><span class="valor">' + brl(atual.total) + "</span>" +
      (datas ? '<div class="datas">' + datas + "</div>" : "") + "</div>";
    if (r.info && (atual.previsto || atual.lancado)) h += '<p class="nota">Pelos lançamentos que o banco já informou; compras dos últimos dias podem ainda não ter chegado.</p>';

    // fatura fechada: valor exato do banco
    if (r.fechada) {
      var f = r.fechada, venceu = f.vencimento < hoje;
      var situacao = f.paga ? '<span class="entrou">' + ic("ok", "ic-p") + " paga</span>"
        : f.pago > 0 ? "pago " + brl(f.pago) + " de " + brl(f.total)
        : venceu ? '<span class="acima">' + ic("alerta", "ic-p") + " venceu em " + dataBR(f.vencimento) + "</span>"
        : "a pagar até " + dataBR(f.vencimento);
      h += '<p class="nota" style="margin-top:10px">Fatura fechada de ' + MESES[Number(f.vencimento.slice(5, 7)) - 1] +
        " (vence " + dataBR(f.vencimento) + "): <strong>" + brl(f.total) + "</strong>" +
        (f.minimo && !f.paga ? " · mínimo " + brl(f.minimo) : "") + " · " + situacao + "</p>";
    }
    if (r.estimado) h += '<p class="nota">Estimativa pelo mês das compras. Para acertar o ciclo, ponha os dias de fechamento e vencimento em <a href="#" data-ir="config">Configurar</a>.</p>';

    // próximas faturas
    var max = 0;
    r.meses.forEach(function (m) { max = Math.max(max, m.total); });
    h += '<h3 class="sub-titulo">Próximas faturas <small>o que já está comprado</small></h3>';
    h += '<div class="colunas baixas">';
    r.meses.forEach(function (m, i) {
      var d = (i === 0 ? "Fatura atual" : "Fatura de " + nomeMes(m.mes)) + ": " + brl(m.total);
      if (m.lancado) d += "\nlançado: " + brl(m.lancado);
      if (m.parcelas) d += "\nparcelas por vir: " + brl(m.parcelas);
      if (m.previsto) d += "\nprevisto pelo banco: " + brl(m.previsto);
      m.itens.slice().sort(function (a, b) { return b.valor - a.valor; }).slice(0, 5).forEach(function (it) {
        d += "\n· " + it.descricao + " " + brl(it.valor);
      });
      h += '<div class="coluna' + (i === 0 ? " atual" : "") + '" data-dica="' + esc(d) + '">' +
        (m.total > 0 ? '<div class="b-' + p + '" style="height:' + (max ? m.total / max * 100 : 0) + '%"></div>' : "") + "</div>";
    });
    h += '</div><div class="col-rotulos">';
    r.meses.forEach(function (m, i) {
      h += '<div class="' + (i === 0 ? "atual-rotulo" : "") + '">' + mesCurto(m.mes) + "<br>" + (m.total ? brlCurto(m.total) : "–") + "</div>";
    });
    h += "</div>";
    h += '<p class="nota">Compras novas ainda não entram aqui: as próximas faturas mostram as parcelas já assumidas.</p>';

    // parcelamentos
    h += '<h3 class="sub-titulo">Parcelamentos em andamento</h3>';
    if (!r.parcelamentos.length) h += '<p class="vazio-curto">Nenhuma compra parcelada em andamento.</p>';
    else {
      var falta = 0;
      h += '<ul class="lista-simples lista-parc lista-topo">';
      r.parcelamentos.forEach(function (x) {
        falta += x.falta;
        h += '<li><span class="desc-curta" title="' + esc(x.descricao) + '">' + esc(x.descricao) +
          ' <span class="parcela-n">' + x.k + "/" + x.n + "</span></span>" +
          '<span class="num">' + brl(x.valor) + '<span class="mudo"> · falta ' + brl(x.falta) + " · até " + mesCurto(x.termina) + "</span></span></li>";
      });
      h += '</ul><p class="nota">Ainda a pagar em parcelas: <strong>' + brl(falta) + "</strong></p>";
    }

    // anteriores
    if (r.anteriores.length) {
      h += '<h3 class="sub-titulo">Faturas anteriores</h3><ul class="lista-simples lista-topo">';
      r.anteriores.forEach(function (x) {
        h += "<li><span>" + nomeMes(x.mes) + (x.fonte === "compras" ? ' <span class="mudo">(soma das compras)</span>' : "") +
          '</span><span class="num">' + brl(x.total) + "</span></li>";
      });
      h += "</ul>";
    }
    if (r.info && r.info.atualizadoEm)
      h += '<p class="nota">Dados do banco de ' + esc(new Date(r.info.atualizadoEm).toLocaleString("pt-BR")) + ".</p>";
    h += "</section>";
  });
  h += "</div>";
  el.innerHTML = h;
  ligarLinks(el);
}

$("#arquivo").addEventListener("change", function () { lerArquivos(this.files); this.value = ""; });

function lerTexto(arq) {
  return arq.text ? arq.arrayBuffer().then(decodificar) : new Promise(function (ok, erro) {
    var fr = new FileReader();
    fr.onload = function () { ok(decodificar(fr.result)); };
    fr.onerror = erro;
    fr.readAsArrayBuffer(arq);
  });
}
/* OFX de banco às vezes vem em Latin-1: se o UTF-8 der caractere quebrado, relê. */
function decodificar(buf) {
  var t = new TextDecoder("utf-8").decode(buf);
  if (t.indexOf("�") !== -1) t = new TextDecoder("windows-1252").decode(buf);
  return t;
}

function lerArquivos(lista) {
  var arqs = Array.prototype.slice.call(lista || []);
  var log = $("#log");
  var p = pessoaImport;
  var ultimoMes = "";
  arqs.reduce(function (cadeia, arq) {
    return cadeia.then(function () { return lerTexto(arq); }).then(function (texto) {
      var lido = N.lerArquivo(texto);
      var conta = p + "-" + lido.tipo;
      var r = N.importar(estado, conta, lido.itens, lido.formato);
      salvar();
      var meses = {};
      lido.itens.forEach(function (i) { meses[N.mesDe(i.data)] = true; });
      var ms = Object.keys(meses).sort();
      if (ms.length && ms[ms.length - 1] > ultimoMes) ultimoMes = ms[ms.length - 1];
      log.insertAdjacentHTML("afterbegin", "<div>" + ic("ok") + "<span><strong>" + esc(arq.name) + "</strong> → " + esc(nome(p)) + " · " +
        N.TIPOS_CONTA[lido.tipo] + ": " + r.novas + " nova" + (r.novas === 1 ? "" : "s") +
        (r.repetidas ? ", " + r.repetidas + " já estava" + (r.repetidas === 1 ? "" : "m") + " aqui" : "") + "</span></div>");
    }).catch(function (err) {
      log.insertAdjacentHTML("afterbegin", '<div class="erro">' + ic("alerta") + "<span><strong>" + esc(arq.name) + "</strong>: " + esc(err.message || err) + "</span></div>");
    });
  }, Promise.resolve()).then(function () {
    if (ultimoMes) mesAtual = ultimoMes;
    pintarCabecalho();
  });
}

    .sort(function (a, b) { return a.r.categoria.localeCompare(b.r.categoria) || a.r.termo.localeCompare(b.r.termo); });
  h += '<section class="bloco"><h2 class="bloco-titulo">Regras automáticas</h2>' +
    '<p class="sub" style="margin-top:0">Se a descrição tiver o termo (palavra inteira, sem ligar para acento ou maiúscula), a transação ganha a categoria. ' +
    "O termo mais longo vence: “uber eats” ganha de “uber”. Editar uma transação à mão sempre vence a regra.</p>";
  h += '<div class="linha-form" style="margin-top:0"><input type="text" id="nova-regra-termo" placeholder="termo, ex.: padaria do ze">' +
    '<select id="nova-regra-cat">' + opcoesCategoria("outros") + "</select>" +
    '<select id="nova-regra-div"><option value="">divisão da categoria</option><option value="casal">sempre do casal</option><option value="pessoal">sempre pessoal</option></select>' +
    '<button class="botao" id="add-regra">Adicionar regra</button>' +
    '<button class="botao" id="reaplicar">Reaplicar regras</button></div>';
  h += '<div class="linha-form"><input type="search" id="busca-regra" placeholder="Filtrar regras…" style="flex:1"></div>';
  h += '<div class="rolar" style="max-height:360px;overflow-y:auto;margin-top:8px"><table class="tabela-conf"><thead><tr><th>Termo</th><th>Categoria</th><th>Divisão</th><th></th></tr></thead><tbody id="tab-regras">';
  regras.forEach(function (x) {
    var c = N.categoria(estado, x.r.categoria);
    h += '<tr data-regra="' + x.i + '" data-busca="' + esc(N.normalizar(x.r.termo + " " + (c ? c.nome : ""))) + '"><td>' + esc(x.r.termo) + "</td><td>" + esc(c ? c.nome : x.r.categoria) +
      "</td><td>" + (x.r.divisao === "casal" ? "do casal" : x.r.divisao === "pessoal" ? "pessoal" : '<span class="mudo">da categoria</span>') +
      '</td><td><button class="botao-x" data-apagar-regra title="Apagar regra" aria-label="Apagar regra">' + ic("x") + "</button></td></tr>";
  });
  h += "</tbody></table></div></section>";

  /* Backup */
  h += '<section class="bloco"><h2 class="bloco-titulo">Backup</h2>' +
    '<p class="sub" style="margin-top:0">' + (nuvem.id
      ? "Os dados ficam neste aparelho e no cofre cifrado. Um backup em arquivo é a garantia extra, caso a senha se perca."
      : "Sem o cofre conectado, tudo fica só <strong>neste navegador</strong>. “Juntar backup” soma o arquivo de outro aparelho a este, sem duplicar.") + "</p>" +
    '<div class="linha-form"><button class="botao primario" id="exportar">Exportar backup</button>' +
    '<button class="botao" id="juntar">Juntar backup…</button>' +
    '<button class="botao perigo" id="apagar-tudo">Apagar tudo</button></div>' +
    '<p class="sub">' + estado.transacoes.length + " transações salvas.</p></section>";

  el.innerHTML = h;

  /* ligações */
  $$("input[data-pessoa]", el).forEach(function (i) {
    i.addEventListener("change", function () {
      estado.pessoas[i.dataset.pessoa][i.dataset.k] = i.value.trim();
      if (i.dataset.k === "nomeBanco") N.reaplicarRegras(estado);
      salvarConfig(); desenharConfig();
    });
  });
  $("#c-div").addEventListener("change", function () {
    var v = Math.min(100, Math.max(0, Number(this.value) || 0));
    estado.divisao.p1 = v; salvarConfig(); desenharConfig();
  });
  $$("tr[data-cat] input", el).forEach(function (i) {
    i.addEventListener("change", function () {
      var c = N.categoria(estado, i.closest("tr").dataset.cat);
      if (i.dataset.k === "casal") c.casal = i.checked;
      else if (i.dataset.k === "orcamento") c.orcamento = Number(i.value) || 0;
      else c.nome = i.value.trim() || c.nome;
      salvarConfig();
    });
  });
  $$("[data-apagar-cat]", el).forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.closest("tr").dataset.cat, c = N.categoria(estado, id);
      var n = estado.transacoes.filter(function (t) { return t.categoria === id; }).length;
      if (!confirm('Apagar a categoria "' + c.nome + '"?' + (n ? "\n\n" + n + " transações vão para Outros." : ""))) return;
      estado.categorias = estado.categorias.filter(function (x) { return x.id !== id; });
      estado.regras = estado.regras.filter(function (r) { return r.categoria !== id; });
      estado.transacoes.forEach(function (t) { if (t.categoria === id) t.categoria = "outros"; });
      salvarConfig(); desenharConfig();
    });
  });
  $("#add-cat").addEventListener("click", function () {
    var n = $("#nova-cat").value.trim();
    if (!n) return;
    var id = N.normalizar(n).replace(/ /g, "-") || "cat";
    while (N.categoria(estado, id)) id += "-2";
    var i = estado.categorias.findIndex(function (c) { return c.id === "outros"; });
    estado.categorias.splice(i < 0 ? estado.categorias.length : i, 0, { id: id, nome: n, casal: false, orcamento: 0 });
    salvarConfig(); desenharConfig();
  });
  $("#add-regra").addEventListener("click", function () {
    var t = N.normalizar($("#nova-regra-termo").value);
    if (!t) return;
    estado.regras = estado.regras.filter(function (r) { return N.normalizar(r.termo) !== t; });
    estado.regras.push({ termo: t, categoria: $("#nova-regra-cat").value, divisao: $("#nova-regra-div").value });
    var n = N.reaplicarRegras(estado);
    salvarConfig(); desenharConfig();
    brinde("Regra criada" + (n ? ", " + n + " transações mudaram." : "."));
  });
  $("#reaplicar").addEventListener("click", function () {
    var n = N.reaplicarRegras(estado);
    salvar();
    brinde(n ? n + " transações mudaram de categoria." : "Nada mudou: tudo já seguia as regras.");
  });
  $("#busca-regra").addEventListener("input", function () {
    var q = N.normalizar(this.value);
    $$("#tab-regras tr").forEach(function (tr) { tr.style.display = !q || tr.dataset.busca.indexOf(q) !== -1 ? "" : "none"; });
  });
  $$("[data-apagar-regra]", el).forEach(function (b) {
    b.addEventListener("click", function () {
      estado.regras.splice(Number(b.closest("tr").dataset.regra), 1);
      salvarConfig(); desenharConfig();
    });
  });
  $("#exportar").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(estado, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "financas-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $("#juntar").addEventListener("click", function () { $("#arquivo-backup").click(); });
  $("#apagar-tudo").addEventListener("click", function () {
    var msg = nuvem.id
      ? "Apagar tudo DESTE APARELHO e desconectar do cofre?\n\nO cofre e o celular da outra pessoa continuam intactos."
      : "Apagar TODAS as transações, regras e categorias deste navegador?\n\nExporte um backup antes se quiser guardar.";
    if (!confirm(msg)) return;
    nuvem = {}; gravarNuvem(); mostrarNuvem("off");
    estado = N.estadoPadrao(); gravarLocal(); desenharConfig(); brinde("Tudo apagado deste aparelho.");
  });
  if (!nuvem.id) {
    $("#nuvem-gerar").addEventListener("click", function () { $("#nuvem-senha").value = N.gerarSenha(); });
    $("#nuvem-conectar").addEventListener("click", function () {
      conectar($("#nuvem-senha").value, $("#nuvem-servidor") ? $("#nuvem-servidor").value : "");
    });
  } else {
    $("#nuvem-agora").addEventListener("click", function () { sincronizar(); });
    $("#nuvem-sair").addEventListener("click", function () {
      if (!confirm("Desconectar este aparelho do cofre?\n\nOs dados continuam aqui e no cofre; para voltar, é só usar a senha de novo.")) return;
      nuvem = {}; gravarNuvem(); mostrarNuvem("off"); desenharConfig();
    });
    if ($("#nuvem-convite")) $("#nuvem-convite").addEventListener("click", function () {
      var link = linkConvite();
      var copiar = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(link) : Promise.reject();
      copiar.then(function () { brinde("Link copiado. Mande só para a outra pessoa."); },
                  function () { prompt("Copie o link e mande só para a outra pessoa:", link); });
    });
  }
}

$("#arquivo-backup").addEventListener("change", function () {
  var arq = this.files[0];
  this.value = "";
  if (!arq) return;
  lerTexto(arq).then(function (t) {
    var outro = JSON.parse(t);
    if (!outro || !Array.isArray(outro.transacoes)) throw new Error("não parece um backup deste app");
    var n = N.mesclar(estado, outro);
    salvar(); desenhar();
    brinde(n + " transações novas vieram do backup.");
  }).catch(function (err) { brinde("Não deu para ler o backup: " + (err.message || err)); });
});

/* ------------------------------------------------------------------ início */
if (window.FINANCAS_PLUGGY) {
  var r = N.importarPluggy(estado, window.FINANCAS_PLUGGY);
  salvar();
  if (r.novas) setTimeout(function () { brinde(r.novas + " transações novas do Open Finance."); }, 300);
}
/* Abre no último mês que tem dado, se o atual estiver vazio. */
if (estado.transacoes.length && !estado.transacoes.some(function (t) { return N.mesDe(t.data) === mesAtual; })) {
  mesAtual = N.mesDe(estado.transacoes[0].data);
}
$("#nuvem-ind").addEventListener("click", function () { trocarAba("config"); });
trocarAba("resumo");

/* Link de convite: .../#cofre=senha. O que vem depois do # não vai para o
   servidor; tiro da barra de endereço logo em seguida. */
var convite = /[#&]cofre=([^&]+)/.exec(location.hash);
if (convite) {
  history.replaceState(null, "", location.pathname + location.search);
  var senhaConvite = decodeURIComponent(convite[1]);
  if (!nuvem.id) { trocarAba("config"); conectar(senhaConvite, ""); }
  else if (N.limparSenha(senhaConvite) !== nuvem.senha) brinde("Este aparelho já está conectado a um cofre. Desconecte em Configurar para usar o convite.", 8000);
}
if (nuvem.id) {
  mostrarNuvem("indo");
  sincronizar();
}
setInterval(function () { if (nuvem.id && !document.hidden) sincronizar(); }, 60000);
document.addEventListener("visibilitychange", function () { if (nuvem.id && !document.hidden) sincronizar(); });
window.addEventListener("online", function () { if (nuvem.id) sincronizar(); });
})();
</script>
</body>
</html>
