<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finanças do Casal</title>
<meta name="theme-color" content="#6d1fb8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%236d1fb8'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'%3ER$%3C/text%3E%3C/svg%3E">
<style>
/* Cores por papel. As duas pessoas usam os dois primeiros tons da paleta
   categórica validada (azul e laranja) - passam no teste de daltonismo nos
   dois temas. A cor nunca anda sozinha: todo número tem o nome do lado. */
:root {
  color-scheme: light;
  --fundo: #f9f9f7;
  --superficie: #fcfcfb;
  --superficie-2: #f0efec;
  --tinta: #0b0b0b;
  --tinta-2: #52514e;
  --tinta-3: #6b6a65;
  --linha: #e1e0d9;
  --base: #c3c2b7;
  --borda: rgba(11,11,11,0.10);
  --destaque: #6d1fb8;
  --destaque-tinta: #ffffff;
  --p1: #2a78d6;
  --p2: #eb6834;
  --bom: #006300;
  --ruim: #b42d2d;
  --aviso-fundo: #fff4d6;
  --sombra: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --fundo: #0d0d0d;
    --superficie: #1a1a19;
    --superficie-2: #262624;
    --tinta: #ffffff;
    --tinta-2: #c3c2b7;
    --tinta-3: #9a988f;
    --linha: #2c2c2a;
    --base: #383835;
    --borda: rgba(255,255,255,0.10);
    --destaque: #a974f0;
    --destaque-tinta: #0d0d0d;
    --p1: #3987e5;
    --p2: #d95926;
    --bom: #0ca30c;
    --ruim: #e66767;
    --aviso-fundo: #3a2f12;
    --sombra: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --fundo: #0d0d0d;
  --superficie: #1a1a19;
  --superficie-2: #262624;
  --tinta: #ffffff;
  --tinta-2: #c3c2b7;
  --tinta-3: #9a988f;
  --linha: #2c2c2a;
  --base: #383835;
  --borda: rgba(255,255,255,0.10);
  --destaque: #a974f0;
  --destaque-tinta: #0d0d0d;
  --p1: #3987e5;
  --p2: #d95926;
  --bom: #0ca30c;
  --ruim: #e66767;
  --aviso-fundo: #3a2f12;
  --sombra: none;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--fundo);
  color: var(--tinta);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--destaque); }

.topo {
  position: sticky; top: 0; z-index: 5;
  background: var(--superficie);
  border-bottom: 1px solid var(--borda);
}
.topo-dentro {
  max-width: 1100px; margin: 0 auto; padding: 10px 16px;
  display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
}
.marca { font-weight: 700; font-size: 17px; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.nuvem-ind {
  border: 1px solid var(--borda); background: var(--superficie-2); color: var(--tinta-2);
  border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 500; cursor: pointer;
}
.nuvem-ind.erro { color: var(--ruim); }
.marca .ponto { width: 12px; height: 12px; border-radius: 50%; background: var(--destaque); }
.abas { display: flex; gap: 4px; overflow-x: auto; }
.aba {
  border: 0; background: none; padding: 7px 12px; border-radius: 8px; cursor: pointer;
  color: var(--tinta-2); white-space: nowrap;
}
.aba:hover { background: var(--superficie-2); }
.aba[aria-selected="true"] { background: var(--destaque); color: var(--destaque-tinta); font-weight: 600; }

.mes-nav { display: flex; align-items: center; gap: 4px; }
.mes-nav button {
  border: 1px solid var(--borda); background: var(--superficie); border-radius: 8px;
  width: 32px; height: 32px; cursor: pointer;
}
.mes-nav button:hover { background: var(--superficie-2); }
.mes-nav span { min-width: 130px; text-align: center; font-weight: 600; }

main { max-width: 1100px; margin: 0 auto; padding: 16px; }
.painel { display: none; }
.painel.ativo { display: block; }

.cartao {
  background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px;
  padding: 16px; box-shadow: var(--sombra); margin-bottom: 16px;
}
.cartao h2 { font-size: 16px; margin: 0 0 12px; }
.cartao h3 { font-size: 14px; margin: 16px 0 8px; color: var(--tinta-2); }
.sub { color: var(--tinta-2); font-size: 13px; }
.mudo { color: var(--tinta-3); }

.grade { display: grid; gap: 16px; }
.grade > .cartao { margin-bottom: 0; }
.grade-kpi { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin-bottom: 16px; }
.grade-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.grade-2 { align-items: start; }

.kpi { padding: 14px 16px; }
.kpi .rotulo { font-size: 13px; color: var(--tinta-2); display: flex; align-items: center; gap: 6px; }
.kpi .valor { font-size: 26px; font-weight: 700; margin: 2px 0; }
.kpi .det { font-size: 13px; color: var(--tinta-2); }
.delta-sobe { color: var(--ruim); }
.delta-desce { color: var(--bom); }

.bolinha { display: inline-block; width: 10px; height: 10px; border-radius: 50%; flex: none; }
.b-p1 { background: var(--p1); }
.b-p2 { background: var(--p2); }

.legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--tinta-2); margin-bottom: 10px; }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }

/* Barras horizontais por categoria */
.cat-linha { display: grid; grid-template-columns: minmax(90px, 150px) 1fr auto; gap: 4px 10px; align-items: center; padding: 6px 0; }
.cat-nome { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cat-trilho { position: relative; height: 14px; }
.cat-barra { display: flex; height: 100%; gap: 2px; }
.cat-barra > div { height: 100%; min-width: 0; }
.cat-barra > div:first-child { border-radius: 4px 0 0 4px; }
.cat-barra > div:last-child { border-radius: 0 4px 4px 0; }
.cat-barra > div:only-child { border-radius: 4px; }
.cat-meta { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--tinta-2); }
.cat-valor { font-size: 14px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cat-orc { grid-column: 2 / 4; font-size: 12px; color: var(--tinta-2); margin-top: -2px; }
.cat-orc.acima { color: var(--ruim); font-weight: 600; }

/* Cartão */
.limite { margin: 4px 0 14px; }
.limite-trilho { height: 10px; border-radius: 5px; background: var(--superficie-2); overflow: hidden; margin: 6px 0 4px; }
.limite-uso { height: 100%; border-radius: 5px; }
.fatura-atual { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.fatura-atual .valor { font-size: 28px; font-weight: 700; }
.nota { font-size: 13px; color: var(--tinta-2); margin: 6px 0 0; }
.cartao-cab { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 16px; }
.cartao-cab .mudo { font-weight: 400; font-size: 13px; }
.colunas.baixas { height: 130px; }
.col-rotulos .atual-rotulo { color: var(--tinta); font-weight: 600; }
.parcela-n { font-variant-numeric: tabular-nums; color: var(--tinta-2); white-space: nowrap; }
@media (max-width: 520px) {
  .lista-parc li { flex-wrap: wrap; }
  .lista-parc .desc-curta { flex: 1 1 100%; white-space: normal; }
  .lista-parc .num { margin-left: auto; white-space: normal; text-align: right; }
}

/* Colunas por mês */
.colunas { display: flex; align-items: flex-end; gap: 10px; height: 170px; padding-top: 8px; border-bottom: 1px solid var(--base); }
.coluna { flex: 1; display: flex; flex-direction: column-reverse; gap: 2px; height: 100%; cursor: default; }
.coluna > div { width: 100%; max-width: 48px; margin: 0 auto; }
.coluna > div:last-child { border-radius: 4px 4px 0 0; }
.coluna.atual { outline: 2px dashed var(--linha); outline-offset: 3px; border-radius: 4px; }
.col-rotulos { display: flex; gap: 10px; margin-top: 6px; }
.col-rotulos div { flex: 1; text-align: center; font-size: 12px; color: var(--tinta-3); }

.dica {
  position: fixed; z-index: 50; pointer-events: none; display: none;
  background: var(--superficie); color: var(--tinta); border: 1px solid var(--borda);
  border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
  max-width: 260px; white-space: pre-line;
}

.lista-simples { list-style: none; margin: 0; padding: 0; }
.lista-simples li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--linha); font-size: 14px; }
.lista-simples li:last-child { border-bottom: 0; }
.lista-simples .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.desc-curta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* Transações */
.filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filtros input[type="search"] { flex: 1 1 200px; }
input[type="text"], input[type="search"], input[type="number"], input[type="date"], select {
  background: var(--superficie); border: 1px solid var(--base); border-radius: 8px; padding: 6px 8px; min-height: 34px;
}
input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--destaque); outline-offset: 1px; }
.botao {
  border: 1px solid var(--base); background: var(--superficie); border-radius: 8px; padding: 6px 12px;
  cursor: pointer; min-height: 34px;
}
.botao:hover { background: var(--superficie-2); }
.botao.primario { background: var(--destaque); color: var(--destaque-tinta); border-color: var(--destaque); font-weight: 600; }
.botao.perigo { color: var(--ruim); }
.botao-x { border: 0; background: none; cursor: pointer; color: var(--tinta-3); font-size: 18px; line-height: 1; padding: 4px 6px; border-radius: 6px; }
.botao-x:hover { background: var(--superficie-2); color: var(--ruim); }

.tx-cab, .tx {
  display: grid; grid-template-columns: 82px minmax(0, 1fr) 120px 150px 120px 100px 28px;
  gap: 8px; align-items: center; padding: 6px 4px;
}
.tx-cab { font-size: 12px; color: var(--tinta-3); border-bottom: 1px solid var(--base); }
.tx { border-bottom: 1px solid var(--linha); font-size: 14px; }
.tx .valor { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx .entrada { color: var(--bom); }
.tx .fora { color: var(--tinta-3); text-decoration: line-through; }
.tx select { width: 100%; padding: 3px 4px; min-height: 30px; font-size: 13px; }
.tx .quem { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tinta-2); white-space: nowrap; overflow: hidden; }
.tx-desc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 520px) {
  .topo-dentro { padding: 8px 12px; }
  .abas { width: 100%; order: 3; }
  .aba { flex: 1; padding: 7px 4px; font-size: 14px; }
  .mes-nav span { min-width: 120px; }
  .kpi .valor { font-size: 22px; }
  .tabela-conf td:nth-child(2) { width: 96px; }
  .tabela-conf td:nth-child(2) .mudo { font-size: 12px; }
  .tabela-conf th:nth-child(3) { font-size: 0; }
  .tabela-conf th:nth-child(3)::after { content: "Casal"; font-size: 12px; }
}
.tx-total { display: flex; justify-content: space-between; padding: 10px 4px; font-weight: 600; }
@media (max-width: 760px) {
  .tx-cab { display: none; }
  .tx {
    grid-template-columns: 1fr auto 28px;
    grid-template-areas: "desc valor x" "quem data data" "cat div div";
  }
  .tx > :nth-child(1) { grid-area: data; text-align: right; font-size: 12px; color: var(--tinta-3); }
  .tx > :nth-child(2) { grid-area: desc; font-weight: 600; }
  .tx > :nth-child(3) { grid-area: quem; }
  .tx > :nth-child(4) { grid-area: cat; }
  .tx > :nth-child(5) { grid-area: div; }
  .tx > :nth-child(6) { grid-area: valor; }
  .tx > :nth-child(7) { grid-area: x; }
}

/* Importar */
.soltar {
  border: 2px dashed var(--base); border-radius: 12px; padding: 28px 16px; text-align: center;
  cursor: pointer; color: var(--tinta-2);
}
.soltar.por-cima { border-color: var(--destaque); background: var(--superficie-2); }
.soltar strong { color: var(--tinta); }
.passos { margin: 0; padding-left: 20px; }
.passos li { margin: 4px 0; }
.log { margin-top: 12px; }
.log div { padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; background: var(--superficie-2); font-size: 14px; }
.log .erro { color: var(--ruim); }
.escolha-pessoa { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.escolha-pessoa label {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--base); border-radius: 999px;
  padding: 6px 14px; cursor: pointer;
}
.escolha-pessoa input { accent-color: var(--destaque); }
.escolha-pessoa label:has(input:checked) { border-color: var(--destaque); background: var(--superficie-2); font-weight: 600; }
code { background: var(--superficie-2); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
pre { background: var(--superficie-2); padding: 10px 12px; border-radius: 8px; overflow-x: auto; font-size: 13px; }

/* Configurar */
.tabela-conf { width: 100%; border-collapse: collapse; }
.tabela-conf th { text-align: left; font-size: 12px; color: var(--tinta-3); font-weight: 500; padding: 4px 6px; border-bottom: 1px solid var(--base); }
.tabela-conf td { padding: 4px 6px; border-bottom: 1px solid var(--linha); }
.tabela-conf input[type="text"], .tabela-conf input[type="number"], .tabela-conf select { width: 100%; }
.rolar { overflow-x: auto; }
.linha-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.campo { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--tinta-2); }
.campo input { color: var(--tinta); }
.pessoas-conf { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.pessoa-conf { border: 1px solid var(--linha); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.pessoa-conf .titulo { display: flex; align-items: center; gap: 8px; font-weight: 600; }

.aviso { background: var(--aviso-fundo); border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-bottom: 16px; }
.vazio { text-align: center; padding: 40px 16px; color: var(--tinta-2); }
.vazio strong { display: block; font-size: 18px; color: var(--tinta); margin-bottom: 6px; }

.brinde {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60;
  background: var(--tinta); color: var(--fundo); padding: 10px 14px; border-radius: 10px;
  display: none; align-items: center; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 32px);
  font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.brinde input { background: var(--fundo); color: var(--tinta); border: 0; border-radius: 6px; padding: 4px 6px; width: 150px; }
.brinde button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
</style>
</head>
<body>

<header class="topo">
  <div class="topo-dentro">
    <div class="marca"><span class="ponto"></span>Finanças do Casal
      <button class="nuvem-ind" id="nuvem-ind" hidden data-ir-config></button></div>
    <nav class="abas" role="tablist">
      <button class="aba" role="tab" data-aba="resumo" aria-selected="true">Resumo</button>
      <button class="aba" role="tab" data-aba="transacoes">Transações</button>
      <button class="aba" role="tab" data-aba="cartao">Cartão</button>
      <button class="aba" role="tab" data-aba="importar">Importar</button>
      <button class="aba" role="tab" data-aba="config">Configurar</button>
    </nav>
    <div class="mes-nav">
      <button id="mes-ant" aria-label="Mês anterior">‹</button>
      <span id="mes-nome"></span>
      <button id="mes-prox" aria-label="Próximo mês">›</button>
    </div>
  </div>
</header>

<main>
  <section class="painel ativo" id="painel-resumo"></section>
  <section class="painel" id="painel-transacoes"></section>
  <section class="painel" id="painel-cartao"></section>
  <section class="painel" id="painel-importar"></section>
  <section class="painel" id="painel-config"></section>
</main>

<div class="dica" id="dica"></div>
<div class="brinde" id="brinde"></div>
<input type="file" id="arquivo" multiple accept=".csv,.ofx,.txt" hidden>
<input type="file" id="arquivo-backup" accept=".json" hidden>

<!-- Dados baixados pelo financas_pluggy.py (opcional). Se o arquivo não
     existir o navegador só ignora - o app funciona igual com CSV/OFX. -->
<script src="financas-dados.js"></script>

var TERMOS_PADRAO = {

                "mcdonalds", "mc donalds", "bk", "pizzaria", "pizza", "padaria", "bar",
                "cafe", "cafeteria", "starbucks", "subway", "outback", "habibs", "spoleto",
                "giraffas", "sushi", "churrascaria", "hamburgueria", "ze delivery", "aiqfome",

/* ---------------------------------------------------------------- texto */

function normalizar(s) {
  return String(s == null ? "" : s)
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, " ")
    .trim();
}

function contemTermo(descNorm, termoNorm) {
  if (!termoNorm) return false;
  return (" " + descNorm + " ").indexOf(" " + termoNorm + " ") !== -1;
}

/* Hash curto e estável (FNV-1a, duas sementes). Serve para dar um id fixo a
   transações que não trazem id - a mesma linha importada duas vezes cai no
   mesmo id e não duplica. */
function hash(s) {
  var a = 0x811c9dc5, b = 0x01000193 ^ 0x5bd1e995;
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i);
    a ^= c; a = Math.imul(a, 0x01000193) >>> 0;
    b ^= c; b = Math.imul(b, 0x5bd1e995) >>> 0; b ^= b >>> 15;
  }
  return ("0000000" + a.toString(16)).slice(-8) + ("0000000" + (b >>> 0).toString(16)).slice(-8);
}

/* "1.234,56" / "-45.90" / "R$ 12,00" -> número */
function lerValor(s) {
  if (typeof s === "number") return s;
  var t = String(s || "").replace(/[R$\s ]/g, "");
  if (!t) return NaN;
  var neg = false;
  if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); }
  var v = t.lastIndexOf(","), p = t.lastIndexOf(".");
  if (v > -1 && p > -1) {
    if (v > p) t = t.replace(/\./g, "").replace(",", ".");
    else t = t.replace(/,/g, "");
  } else if (v > -1) {
    t = t.replace(",", ".");
  }
  var n = parseFloat(t);
  return neg ? -n : n;
}

/* "2024-01-15", "15/01/2024", "20240115120000[-3:BRT]" -> "2024-01-15" */
function lerData(s) {
  var t = String(s || "").trim(), m;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})/.exec(t))) return m[1] + "-" + m[2] + "-" + m[3];
  if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(t)))
    return m[3] + "-" + ("0" + m[2]).slice(-2) + "-" + ("0" + m[1]).slice(-2);
  if ((m = /^(\d{4})(\d{2})(\d{2})/.exec(t))) return m[1] + "-" + m[2] + "-" + m[3];
  return null;
}

function arred(n) { return Math.round(n * 100) / 100; }

/* ----------------------------------------------------------- arquivos */

function lerCSV(texto) {
  texto = String(texto).replace(/^﻿/, "");
  var primeira = texto.split(/\r?\n/)[0] || "";
  var sep = (primeira.split(";").length > primeira.split(",").length) ? ";" : ",";
  var linhas = [], campo = "", linha = [], aspas = false;
  for (var i = 0; i < texto.length; i++) {
    var c = texto[i];
    if (aspas) {
      if (c === '"') {
        if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false;
      } else campo += c;
    } else if (c === '"' && campo === "") aspas = true;
    else if (c === sep) { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && texto[i + 1] === "\n") i++;
      linha.push(campo); campo = "";
      if (linha.length > 1 || linha[0] !== "") linhas.push(linha);
      linha = [];
    } else campo += c;
  }
  linha.push(campo);
  if (linha.length > 1 || linha[0] !== "") linhas.push(linha);
  return linhas;
}

function detectarFormato(texto) {
  var t = String(texto).replace(/^﻿/, "");
  if (/<OFX>|OFXHEADER/i.test(t.slice(0, 2000))) return "ofx";
  var cab = normalizar((t.split(/\r?\n/)[0] || ""));
  if (contemTermo(cab, "title") && contemTermo(cab, "amount")) return "nubank-cartao";
  if (contemTermo(cab, "identificador") && contemTermo(cab, "descricao")) return "nubank-conta";
  if (contemTermo(cab, "data") && contemTermo(cab, "valor")) return "csv-generico";
  return null;
}

/* Lê um arquivo exportado do Nubank e devolve as transações já com o sinal
   do app. tipo = "cartao" | "conta" (o que o arquivo é). */
function lerArquivo(texto) {
  var formato = detectarFormato(texto);
  if (!formato) throw new Error("Formato não reconhecido. Use o CSV ou OFX exportado pelo Nubank.");
  var itens = [], tipo;

  if (formato === "ofx") {
    tipo = /<CREDITCARDMSGSRSV1>|<CCSTMTRS>/i.test(texto) ? "cartao" : "conta";
    var blocos = String(texto).match(/<STMTTRN>[\s\S]*?(<\/STMTTRN>|(?=<STMTTRN>)|(?=<\/BANKTRANLIST>))/gi) || [];
    blocos.forEach(function (b) {
      var tag = function (n) {
        var m = new RegExp("<" + n + ">([^<\\r\\n]*)", "i").exec(b);
        return m ? m[1].trim() : "";
      };
      var valor = lerValor(tag("TRNAMT"));
      var data = lerData(tag("DTPOSTED"));
      if (isNaN(valor) || !data) return;
      itens.push({
        data: data,
        descricao: tag("MEMO") || tag("NAME") || "(sem descrição)",
        valor: arred(-valor),
        idExterno: tag("FITID") || null
      });
    });
  } else {
    var linhas = lerCSV(texto);
    var cab = linhas.shift().map(normalizar);
    var col = function (nomes) {
      for (var i = 0; i < nomes.length; i++) {
        var k = cab.indexOf(nomes[i]);
        if (k > -1) return k;
      }
      return -1;
    };
    var cData, cDesc, cValor, cId = -1, inverte;
    if (formato === "nubank-cartao") {
      tipo = "cartao";
      cData = col(["date"]); cDesc = col(["title"]); cValor = col(["amount"]);
      inverte = false;            // fatura: compra vem positiva
    } else if (formato === "nubank-conta") {
      tipo = "conta";
      cData = col(["data"]); cDesc = col(["descricao"]); cValor = col(["valor"]);
      cId = col(["identificador"]);
      inverte = true;             // extrato: saída vem negativa
    } else {
      tipo = "conta";
      cData = col(["data", "date"]); cDesc = col(["descricao", "historico", "title", "lancamento"]);
      cValor = col(["valor", "amount"]);
      inverte = true;
    }
    if (cData < 0 || cValor < 0) throw new Error("O arquivo não tem as colunas de data e valor.");
    linhas.forEach(function (l) {
      var data = lerData(l[cData]), valor = lerValor(l[cValor]);
      if (!data || isNaN(valor)) return;
      itens.push({
        data: data,
        descricao: (cDesc > -1 ? l[cDesc] : "").trim() || "(sem descrição)",
        valor: arred(inverte ? -valor : valor),
        idExterno: cId > -1 && l[cId] ? l[cId].trim() : null
      });
    });
  }
  return { formato: formato, tipo: tipo, itens: itens };
}

/* --------------------------------------------------------------- estado */

function estadoPadrao() {
  var regras = [];
  Object.keys(TERMOS_PADRAO).forEach(function (cat) {
    TERMOS_PADRAO[cat].forEach(function (t) { regras.push({ termo: t, categoria: cat, divisao: "" }); });
  });
  return {
    versao: 1,
    pessoas: {
      p1: { nome: "Eu", nomeBanco: "" },
      p2: { nome: "Namorada", nomeBanco: "" }
    },
    divisao: { p1: 50 },          // % das despesas do casal que cabe à p1
    categorias: CATEGORIAS_PADRAO.map(function (c) { return Object.assign({}, c); }),
    regras: regras,
    transacoes: [],
    apagadas: {},                 // id -> quando foi apagada (para não voltar na sincronização)
    cartoes: {},                  // id da conta no Pluggy -> limite, faturas, previstas (do banco)
    configAlterada: 0,            // quando nomes/categorias/regras mudaram pela última vez
    pluggy: { geradoEm: null }
  };
}

/* Completa um estado salvo com o que faltar (versões futuras, backup velho). */
function completar(e) {
  var p = estadoPadrao();
  if (!e || typeof e !== "object") return p;
  e.pessoas = e.pessoas || p.pessoas;
  PESSOAS.forEach(function (id) { e.pessoas[id] = Object.assign({ nome: p.pessoas[id].nome, nomeBanco: "" }, e.pessoas[id]); });
  e.divisao = e.divisao || p.divisao;
  e.categorias = Array.isArray(e.categorias) ? e.categorias : p.categorias;
  ["outros", "entradas", "entre", "fora"].forEach(function (id) {
    if (!e.categorias.some(function (c) { return c.id === id; }))
      e.categorias.push(Object.assign({}, CATEGORIAS_PADRAO.filter(function (c) { return c.id === id; })[0]));
  });
  e.regras = Array.isArray(e.regras) ? e.regras : p.regras;
  e.transacoes = Array.isArray(e.transacoes) ? e.transacoes : [];
  e.pluggy = e.pluggy || { geradoEm: null };
  e.apagadas = e.apagadas && typeof e.apagadas === "object" ? e.apagadas : {};
  e.configAlterada = Number(e.configAlterada) || 0;
  e.cartoes = e.cartoes && typeof e.cartoes === "object" && !Array.isArray(e.cartoes) ? e.cartoes : {};
  return e;
}

function pessoaDaConta(contaId) { return String(contaId).split("-")[0]; }
function tipoDaConta(contaId) { return String(contaId).split("-")[1]; }
function outra(p) { return p === "p1" ? "p2" : "p1"; }
function mesDe(data) { return String(data).slice(0, 7); }
function categoria(e, id) {
  for (var i = 0; i < e.categorias.length; i++) if (e.categorias[i].id === id) return e.categorias[i];
  return null;
}
function ehGasto(t) { return !ESPECIAIS[t.categoria]; }
function pct(e, p) {
  var a = Math.min(100, Math.max(0, Number(e.divisao.p1)));
  if (isNaN(a)) a = 50;
  return (p === "p1" ? a : 100 - a) / 100;
}

/* Decide categoria e divisão de uma transação nova. Ordem:
   1. Pix/transferência para a outra pessoa (pelo nome no banco) -> "entre"
   2. regras do usuário (termo mais longo ganha: "uber eats" antes de "uber")
   3. dica do Pluggy
   4. valor negativo sem regra: na conta é entrada; no cartão é estorno
   5. "outros" */
function categorizar(e, descricao, valor, contaId, dicaPluggy) {
  var d = normalizar(descricao);
  var dono = pessoaDaConta(contaId);
  var cat = null, div = "";

  var nomeOutra = normalizar(e.pessoas[outra(dono)] && e.pessoas[outra(dono)].nomeBanco);
  if (nomeOutra && contemTermo(d, nomeOutra) &&
      /transf|pix|ted|doc/.test(d)) cat = "entre";

  if (!cat) {
    var melhor = null;
    e.regras.forEach(function (r) {
      var t = normalizar(r.termo);
      if (t && contemTermo(d, t) && (!melhor || t.length > melhor.t.length)) melhor = { t: t, r: r };
    });
    if (melhor && categoria(e, melhor.r.categoria)) { cat = melhor.r.categoria; div = melhor.r.divisao || ""; }
  }

  if (!cat && dicaPluggy) {
    var h = normalizar(dicaPluggy);
    for (var i = 0; i < MAPA_PLUGGY.length; i++) {
      if (h.indexOf(MAPA_PLUGGY[i][0]) !== -1) { cat = MAPA_PLUGGY[i][1]; break; }
    }
  }

  if (!cat && valor < 0) cat = tipoDaConta(contaId) === "cartao" ? "outros" : "entradas";
  if (!cat) cat = "outros";

  if (!div) {
    var c = categoria(e, cat);
    div = c && c.casal ? "casal" : "pessoal";
  }
  return { categoria: cat, divisao: div };
}

/* Põe as transações lidas de um arquivo dentro do estado, sem duplicar.
   Linhas idênticas no mesmo arquivo (dois cafés iguais no mesmo dia) viram
   ids diferentes pela ordem de aparição - e reimportar o arquivo dá os
   mesmos ids de novo. */
function importar(e, contaId, itens, origem) {
  var existentes = {};
  e.transacoes.forEach(function (t) { existentes[t.id] = true; });
  Object.keys(e.apagadas || {}).forEach(function (id) { existentes[id] = true; });
  var vistos = {}, novas = 0, repetidas = 0, agora = Date.now();
  itens.forEach(function (it) {
    var id;
    if (it.id) id = it.id;
    else if (it.idExterno) id = hash(contaId + "|" + it.idExterno);
    else {
      var chave = contaId + "|" + it.data + "|" + normalizar(it.descricao) + "|" + it.valor.toFixed(2);
      vistos[chave] = (vistos[chave] || 0) + 1;
      id = hash(chave + "|" + vistos[chave]);
    }
    if (existentes[id]) { repetidas++; return; }
    existentes[id] = true;
    var c = categorizar(e, it.descricao, it.valor, contaId, it.dica);
    e.transacoes.push({
      id: id, conta: contaId, data: it.data, descricao: it.descricao,
      valor: arred(it.valor), categoria: c.categoria, divisao: c.divisao, origem: origem,
      alterado: agora
    });
    copiarCamposCartao(e.transacoes[e.transacoes.length - 1], it);
    novas++;
  });
  e.transacoes.sort(function (a, b) { return a.data < b.data ? 1 : a.data > b.data ? -1 : 0; });
  return { novas: novas, repetidas: repetidas };
}

/* Os dados do financas_pluggy.py: window.FINANCAS_PLUGGY */
/* Campos do cartão que vêm do Pluggy: parcela 3 de 10, a fatura em que a
   compra cai (AAAA-MM, mês do vencimento) e o id da fatura no banco. */
var CAMPOS_CARTAO = ["parcela", "parcelas", "fatura", "billId"];
function copiarCamposCartao(t, it) {
  var mudou = false;
  CAMPOS_CARTAO.forEach(function (k) {
    if (it[k] != null && it[k] !== "" && t[k] == null) { t[k] = it[k]; mudou = true; }
  });
  return mudou;
}

/* Os dados do financas_pluggy.py: window.FINANCAS_PLUGGY */
function importarPluggy(e, dados) {
  if (!dados || !Array.isArray(dados.transacoes)) return { novas: 0, repetidas: 0, cartoes: 0, completadas: 0 };
  var porConta = {}, porId = {};
  e.transacoes.forEach(function (t) { porId[t.id] = t; });
  var completadas = 0;
  dados.transacoes.forEach(function (t) {
    if (PESSOAS.indexOf(t.pessoa) === -1) return;
    var conta = t.pessoa + "-" + (t.tipo === "cartao" ? "cartao" : "conta");
    var it = {
      id: "pg-" + t.id, data: t.data, descricao: t.descricao, valor: Number(t.valor), dica: t.categoriaPluggy,
      parcela: t.parcela, parcelas: t.parcelas, fatura: t.fatura, billId: t.billId
    };
    // transação que já veio antes, sem os dados do cartão: completa (uma vez)
    if (porId[it.id] && copiarCamposCartao(porId[it.id], it)) completadas++;
    (porConta[conta] = porConta[conta] || []).push(it);
  });
  var tot = { novas: 0, repetidas: 0, cartoes: 0, completadas: completadas };
  Object.keys(porConta).forEach(function (conta) {
    var r = importar(e, conta, porConta[conta], "pluggy");
    tot.novas += r.novas; tot.repetidas += r.repetidas;
  });
  (dados.cartoes || []).forEach(function (c) {
    if (!c || !c.conta || PESSOAS.indexOf(c.pessoa) === -1) return;
    var atual = e.cartoes[c.conta];
    if (!atual || String(c.atualizadoEm || "") > String(atual.atualizadoEm || "")) {
      e.cartoes[c.conta] = JSON.parse(JSON.stringify(c));
      tot.cartoes++;
    }
  });
  e.pluggy.geradoEm = dados.geradoEm || null;
  return tot;
}

/* Reaplica as regras nas transações que ninguém editou à mão. */
function reaplicarRegras(e) {
  var mudou = 0;
  e.transacoes.forEach(function (t) {
    if (t.manual) return;
    var c = categorizar(e, t.descricao, t.valor, t.conta, null);
    if (t.origem === "pluggy" && c.categoria === "outros") return; // mantém a dica do Pluggy
    if (c.categoria !== t.categoria || c.divisao !== t.divisao) {
      t.categoria = c.categoria; t.divisao = c.divisao; t.alterado = Date.now(); mudou++;
    }
  });
  return mudou;
}

/* Junta outro estado a este: o backup de outro aparelho ou o que veio da
   nuvem. É o que deixa os dois mexerem ao mesmo tempo sem um apagar o do
   outro:
   - transação: vale a versão editada por último (campo "alterado");
   - transação apagada em qualquer lado fica apagada nos dois;
   - nomes, categorias, regras e divisão andam juntos: vale o bloco
     mexido por último (configAlterada).
   Devolve quantas transações novas chegaram. */
function mesclar(e, outro) {
  outro = completar(outro);
  Object.keys(outro.apagadas).forEach(function (id) {
    e.apagadas[id] = Math.max(e.apagadas[id] || 0, outro.apagadas[id] || 0);
  });
  var porId = {};
  e.transacoes.forEach(function (t) { porId[t.id] = t; });
  var novas = 0;
  outro.transacoes.forEach(function (t) {
    if (e.apagadas[t.id]) return;
    var a = porId[t.id];
    if (!a) { t = JSON.parse(JSON.stringify(t)); e.transacoes.push(t); porId[t.id] = t; novas++; return; }
    var ta = t.alterado || 0, aa = a.alterado || 0;
    if (ta > aa || (ta === aa && t.manual && !a.manual)) {
      Object.keys(a).forEach(function (k) { delete a[k]; });
      Object.assign(a, JSON.parse(JSON.stringify(t)));
    }
  });
  e.transacoes = e.transacoes.filter(function (t) { return !e.apagadas[t.id]; });
  if (outro.configAlterada > e.configAlterada) {
    var copia = JSON.parse(JSON.stringify(outro));
    e.pessoas = copia.pessoas; e.divisao = copia.divisao;
    e.categorias = copia.categorias; e.regras = copia.regras;
    e.configAlterada = copia.configAlterada;
  }
  Object.keys(outro.cartoes).forEach(function (k) {
    var a = e.cartoes[k], b = outro.cartoes[k];
    if (!a || String(b.atualizadoEm || "") > String(a.atualizadoEm || "")) e.cartoes[k] = JSON.parse(JSON.stringify(b));

    e.pluggy.geradoEm = outro.pluggy.geradoEm;
  e.transacoes.sort(function (a, b) {
    return a.data < b.data ? 1 : a.data > b.data ? -1 : a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  });

/* JSON com as chaves em ordem: dois estados iguais dão o mesmo texto, não
   importa em que ordem cada aparelho montou os objetos. */
function canonico(x) {
  if (Array.isArray(x)) return "[" + x.map(canonico).join(",") + "]";
  if (x && typeof x === "object") {
    return "{" + Object.keys(x).sort().filter(function (k) { return x[k] !== undefined; })
      .map(function (k) { return JSON.stringify(k) + ":" + canonico(x[k]); }).join(",") + "}";
  }
  return JSON.stringify(x);

/* ----------------------------------------------------- nuvem (cifrada) */

/* A senha do casal vira DUAS coisas, pelo PBKDF2: a chave AES que embaralha
   os dados e o id do cofre no servidor. O servidor só vê o id e o texto
   cifrado - sem a senha, não tem como ler nada. O sal é fixo porque a senha
   é o único segredo e precisa dar o mesmo cofre nos dois celulares. */
var SAL = "financas-do-casal/cofre/v1";
var ITERACOES = 310000;
var cripto = raiz.crypto && raiz.crypto.subtle;

function paraB64(bytes) {

    .then(function (base) {

    })

      var id = Array.prototype.map.call(b.subarray(32), function (x) { return ("0" + x.toString(16)).slice(-2); }).join("");
      return { id: id, chave: paraB64(b.subarray(0, 32)) };
    });
}
function chaveAES(chaveB64) {
  return cripto.importKey("raw", deB64(chaveB64), "AES-GCM", false, ["encrypt", "decrypt"]);
}

  return new Response(new Blob([bytes]).stream().pipeThrough(fluxo)).arrayBuffer()
    .then(function (b) { return new Uint8Array(b); });
}

  var zip = typeof CompressionStream !== "undefined";
  var iv = raiz.crypto.getRandomValues(new Uint8Array(12));
  return (zip ? passarPor(bruto, new CompressionStream("gzip")) : Promise.resolve(bruto))
    .then(function (dados) {
      return chaveAES(chaveB64).then(function (k) { return cripto.encrypt({ name: "AES-GCM", iv: iv }, k, dados); });
    })
    .then(function (c) {
      return JSON.stringify({ v: 1, z: zip, iv: paraB64(iv), d: paraB64(new Uint8Array(c)) });
    });
}

  var env = JSON.parse(texto);

    .then(function (k) { return cripto.decrypt({ name: "AES-GCM", iv: deB64(env.iv) }, k, deB64(env.d)); })
    .then(function (b) {

      return env.z ? passarPor(b, new DecompressionStream("gzip")) : b;

/* Senha aleatória fácil de ditar: 4 grupos de 4, sem 0/o/1/l/i (~79 bits). */
function gerarSenha() {
  var letras = "abcdefghjkmnpqrstuvwxyz23456789";
  var b = raiz.crypto.getRandomValues(new Uint8Array(16)), s = "";
  for (var i = 0; i < 16; i++) {
    if (i && i % 4 === 0) s += "-";
    s += letras[b[i] % letras.length];
  }

}

/* ---------------------------------------------------------------- contas */

function resumoMes(e, mes) {
  var doMes = e.transacoes.filter(function (t) { return mesDe(t.data) === mes; });
  var gastos = doMes.filter(ehGasto);
  var r = {
    total: 0,
    pagou: { p1: 0, p2: 0 },
    custo: { p1: 0, p2: 0 },          // o que é de cada um de verdade: pessoal + sua parte do casal
    pessoal: { p1: 0, p2: 0 },
    casal: 0,
    entradas: { p1: 0, p2: 0 },
    categorias: [],
    maiores: [],
    quantidade: doMes.length
  };
  var porCat = {};
  gastos.forEach(function (t) {
    var p = pessoaDaConta(t.conta);
    r.total += t.valor;
    r.pagou[p] += t.valor;
    if (t.divisao === "casal") {
      r.casal += t.valor;
      r.custo.p1 += t.valor * pct(e, "p1");
      r.custo.p2 += t.valor * pct(e, "p2");
    } else {
      r.pessoal[p] += t.valor;
      r.custo[p] += t.valor;
    }
    var c = porCat[t.categoria] = porCat[t.categoria] || { id: t.categoria, total: 0, p1: 0, p2: 0 };
    c.total += t.valor; c[p] += t.valor;
  });
  doMes.forEach(function (t) {
    if (t.categoria === "entradas" && t.valor < 0) r.entradas[pessoaDaConta(t.conta)] += -t.valor;
  });
  e.categorias.forEach(function (c) {
    if (ESPECIAIS[c.id]) return;
    var x = porCat[c.id];
    if (x || c.orcamento > 0) {
      r.categorias.push({
        id: c.id, nome: c.nome, orcamento: Number(c.orcamento) || 0,
        total: arred(x ? x.total : 0), p1: arred(x ? x.p1 : 0), p2: arred(x ? x.p2 : 0)
      });
    }
  });
  r.categorias.sort(function (a, b) { return b.total - a.total; });
  r.maiores = gastos.slice().sort(function (a, b) { return b.valor - a.valor; }).slice(0, 8);
  ["total", "casal"].forEach(function (k) { r[k] = arred(r[k]); });
  ["pagou", "custo", "pessoal", "entradas"].forEach(function (k) {
    r[k].p1 = arred(r[k].p1); r[k].p2 = arred(r[k].p2);

}

/* ---------------------------------------------------------------- cartão

   As faturas são chamadas pelo mês do VENCIMENTO ("a fatura de novembro" é
   a que vence em novembro). De onde vem a fatura de cada compra, em ordem:
   1. o id da fatura no banco (Pluggy), casado com a lista de faturas;
   2. a previsão do banco (Open Finance: AAAA-MM), que vale até para futuras;
   3. a conta pelos dias de fechamento e vencimento: compra antes do dia de

      do mês seguinte. Sem os dias, fica o mês da compra (estimativa). */

function infoParcela(t) {

  if (n > 1 && k >= 1 && k <= n) return { k: k, n: n };
  var m = /parcela\s*(\d{1,2})\s*(?:\/|de)\s*(\d{1,2})/i.exec(t.descricao || "");

    k = Number(m[1]); n = Number(m[2]);

function baseParcela(descricao) {
  return normalizar(String(descricao || "").replace(/[-–]?\s*parcela\s*\d{1,2}\s*(?:\/|de)\s*\d{1,2}/i, ""));

/* Os dados do cartão de uma pessoa: o que o banco mandou (Pluggy) mais os
   dias de fechamento/vencimento que vocês puseram em Configurar. */
function cartaoDe(e, p) {
  var banco = null;
  Object.keys(e.cartoes || {}).forEach(function (k) {
    var c = e.cartoes[k];
    if (c.pessoa === p && (!banco || String(c.atualizadoEm || "") > String(banco.atualizadoEm || ""))) banco = c;
  });
  var conf = e.pessoas[p] || {};
  var dia = function (iso) { return iso ? Number(String(iso).slice(8, 10)) : 0; };
  var fechamento = dia(banco && banco.fechamento) || Number(conf.diaFechamento) || 0;
  var vencimento = dia(banco && banco.vencimento) || Number(conf.diaVencimento) || 0;
  return { banco: banco, diaFechamento: fechamento, diaVencimento: vencimento };
}

/* Mês de vencimento da fatura em que cai uma compra feita na data d. */
function mesDaFatura(cartao, d) {
  var mes = mesDe(d);
  var F = cartao.diaFechamento, V = cartao.diaVencimento;
  if (!F) return mes;
  var fecha = Number(String(d).slice(8, 10)) < F ? mes : somarMes(mes, 1);
  return V && V <= F ? somarMes(fecha, 1) : fecha;
}

function faturaDa(cartao, t) {
  var bills = (cartao.banco && cartao.banco.faturas) || [];
  if (t.billId) {
    for (var i = 0; i < bills.length; i++)
      if (bills[i].id === t.billId && bills[i].vencimento) return mesDe(bills[i].vencimento);
  }
  if (t.fatura && /^\d{4}-\d{2}$/.test(t.fatura)) return t.fatura;
  return mesDaFatura(cartao, t.data);
}

/* Tudo o que a aba Cartão mostra de uma pessoa. hoje = "AAAA-MM-DD". */
function resumoCartao(e, p, hoje) {
  var cartao = cartaoDe(e, p), banco = cartao.banco;
  var conta = p + "-cartao";
  var doCartao = e.transacoes.filter(function (t) { return t.conta === conta && t.categoria !== "fora"; });

  // fatura aberta: a do banco, se veio; senão, a de uma compra feita hoje
  var aberta = banco && banco.vencimento ? mesDe(banco.vencimento) : mesDaFatura(cartao, hoje);

  var porMes = {};
  function no(mes) {
    return porMes[mes] = porMes[mes] || { mes: mes, lancado: 0, parcelas: 0, previsto: 0, itens: [] };
  }
  var series = {};
  doCartao.forEach(function (t) {
    var mes = faturaDa(cartao, t);
    var m = no(mes);
    m.lancado += t.valor;
    m.itens.push({ descricao: t.descricao, valor: t.valor, data: t.data, tipo: "lancado" });
    var pc = infoParcela(t);
    if (pc) {
      var chave = baseParcela(t.descricao) + "|" + pc.n + "|" + Math.round(Math.abs(t.valor) * 100);
      var s = series[chave] = series[chave] || { descricao: t.descricao, valor: t.valor, n: pc.n, vistas: {}, ultima: null };
      s.vistas[pc.k] = mes;
      if (!s.ultima || pc.k > s.ultima.k) { s.ultima = { k: pc.k, mes: mes }; s.descricao = t.descricao; }
    }
  });

  // o que o banco já prevê (compras pendentes e parcelas futuras, Open Finance)
  var previstasPorChave = {};

    var mes = x.fatura && /^\d{4}-\d{2}$/.test(x.fatura) ? x.fatura : mesDaFatura(cartao, x.data || hoje);
    if (mes < aberta) return;
    var m = no(mes);
    m.previsto += Number(x.valor) || 0;
    m.itens.push({ descricao: x.descricao, valor: Number(x.valor) || 0, data: x.data, tipo: "previsto" });
    var pc = infoParcela(x);
    if (pc) previstasPorChave[baseParcela(x.descricao) + "|" + pc.n + "|" + pc.k] = true;
  });

      if (s.vistas[j] || previstasPorChave[base + "|" + s.n + "|" + j]) continue;
      var mes = somarMes(u.mes, j - u.k);
      var m = no(mes);
      m.parcelas += s.valor;
      m.itens.push({ descricao: s.descricao.replace(/(parcela\s*)\d{1,2}/i, "$1" + j), valor: s.valor, tipo: "parcela" });
      restantes++;
    }
    var termina = somarMes(u.mes, s.n - u.k);
    if (termina >= aberta) {
      parcelamentos.push({
        descricao: s.descricao.replace(/\s*[-–]?\s*parcela\s*\d{1,2}\s*(?:\/|de)\s*\d{1,2}/i, ""),
        k: u.k, n: s.n, valor: arred(s.valor), falta: arred(s.valor * (s.n - u.k)), termina: termina
      });
    }
  });
  parcelamentos.sort(function (a, b) { return a.termina < b.termina ? 1 : a.termina > b.termina ? -1 : b.falta - a.falta; });

  var meses = [];
  for (var i = 0; i < 6; i++) {
    var mes = somarMes(aberta, i), x = porMes[mes] || { mes: mes, lancado: 0, parcelas: 0, previsto: 0, itens: [] };
    meses.push({
      mes: mes, lancado: arred(x.lancado), parcelas: arred(x.parcelas), previsto: arred(x.previsto),
      total: arred(x.lancado + x.parcelas + x.previsto), itens: x.itens
    });
  }

  // faturas anteriores: as do banco; sem banco, a soma das compras
  var anteriores = [];
  var bills = (banco && banco.faturas) || [];
  if (bills.length) {
    bills.forEach(function (b) {
      if (b.vencimento && mesDe(b.vencimento) < aberta)
        anteriores.push({ mes: mesDe(b.vencimento), total: arred(Number(b.total) || 0), vencimento: b.vencimento, fonte: "banco" });
    });
  } else {
    Object.keys(porMes).forEach(function (mes) {
      if (mes < aberta && porMes[mes].lancado) anteriores.push({ mes: mes, total: arred(porMes[mes].lancado), fonte: "compras" });
    });
  }
  anteriores.sort(function (a, b) { return a.mes < b.mes ? 1 : -1; });

  var info = null;
  if (banco) {
    var limite = Number(banco.limite), disp = Number(banco.disponivel);
    info = {
      limite: isFinite(limite) && banco.limite != null ? limite : null,
      disponivel: isFinite(disp) && banco.disponivel != null ? disp : null,
      saldo: banco.saldo != null ? Number(banco.saldo) : null,
      minimo: banco.minimo != null ? Number(banco.minimo) : null,
      fechamento: banco.fechamento || null, vencimento: banco.vencimento || null,
      bandeira: banco.bandeira || "", nome: banco.nome || "", atualizadoEm: banco.atualizadoEm || null
    };
  }
  return {
    temDados: doCartao.length > 0 || !!banco,
    aberta: aberta, info: info,
    diaFechamento: cartao.diaFechamento, diaVencimento: cartao.diaVencimento,
    estimado: !banco && !cartao.diaFechamento,
    meses: meses, parcelamentos: parcelamentos.slice(0, 50), anteriores: anteriores.slice(0, 6)
  };
}

function somarMes(mes, delta) {
  var a = Number(mes.slice(0, 4)), m = Number(mes.slice(5, 7)) - 1 + delta;
  a += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
  return a + "-" + ("0" + (m + 1)).slice(-2);
}

function serieMeses(e, mesFim, n) {
  var out = [];
  for (var i = n - 1; i >= 0; i--) {
    var mes = somarMes(mesFim, -i);
    var x = { mes: mes, p1: 0, p2: 0, total: 0 };
    e.transacoes.forEach(function (t) {
      if (mesDe(t.data) !== mes || !ehGasto(t)) return;
      x[pessoaDaConta(t.conta)] += t.valor; x.total += t.valor;
    });
    x.p1 = arred(x.p1); x.p2 = arred(x.p2); x.total = arred(x.total);
    out.push(x);
  }
  return out;
}

/* Um termo razoável para virar regra a partir de uma descrição:
   "Compra no débito - PADARIA REAL 123" -> "padaria real" */
function sugerirTermo(descricao) {
  var d = normalizar(descricao)
    .replace(/^(compra no debito|compra no credito|transferencia enviada pelo pix|transferencia enviada|pagamento de boleto efetuado|pagamento efetuado|debito automatico|pix enviado)\s*/, "")
    .replace(/\bparcela\s+\d+\s+\d+\b/, "")
    .replace(/\b\d+\b/g, " ")
    .replace(/\s+/g, " ").trim();

  return palavras.slice(0, 2).join(" ");

/* Só para mostrar: tira o prefixo e o CPF/banco que o extrato põe.
   "Transferência enviada pelo Pix - FULANO - •••.123 - BANCO" -> "Pix para FULANO" */
function descricaoCurta(descricao) {
  var d = String(descricao || "");
  var m = /^(transfer[êe]ncia (enviada|recebida) pelo pix|pagamento de boleto efetuado|compra no d[ée]bito|compra no cr[ée]dito)\s+-\s+(.+)$/i.exec(d);
  if (!m) return d;
  if (!m[2]) return m[3];
  return (/recebida/i.test(m[2]) ? "Pix de " : "Pix para ") + m[3].split(" - ")[0];

  importar: importar, importarPluggy: importarPluggy, reaplicarRegras: reaplicarRegras, mesclar: mesclar,
  apagar: apagar, canonico: canonico, derivarCofre: derivarCofre, cifrar: cifrar, decifrar: decifrar,
  gerarSenha: gerarSenha, limparSenha: limparSenha,
  pessoaDaConta: pessoaDaConta, tipoDaConta: tipoDaConta, outra: outra, mesDe: mesDe, categoria: categoria,
  ehGasto: ehGasto, pct: pct, resumoMes: resumoMes, somarMes: somarMes,
  serieMeses: serieMeses, sugerirTermo: sugerirTermo,

  try { return JSON.parse(localStorage.getItem(CHAVE_NUVEM)) || {}; } catch (err) { return {}; }
}
function gravarNuvem() {
  try { localStorage.setItem(CHAVE_NUVEM, JSON.stringify(nuvem)); } catch (err) { /* tenta na próxima */ }
}
function servidorPadrao() { return /^https?:$/.test(location.protocol) ? location.origin : ""; }
function baseServidor() { return (nuvem.servidor || servidorPadrao()).replace(/\/+$/, ""); }
function urlCofre(id) { return baseServidor() + "/api/cofre/" + (id || nuvem.id); }
function agendarNuvem(ms) {
  if (!nuvem.id) return;
  clearTimeout(timerNuvem);
  timerNuvem = setTimeout(sincronizar, ms == null ? 1500 : ms);
}
function erroServidor(r) {
  return r.json().catch(function () { return {}; }).then(function (j) {
    throw new Error(j.erro || "o servidor respondeu " + r.status);
  });
}

function sincronizar() {
  if (!nuvem.id) return Promise.resolve();
  if (sincronizando) { editouDurante = true; return Promise.resolve(); }
  sincronizando = true; editouDurante = false;
  clearTimeout(timerNuvem);
  mostrarNuvem("indo");
  var tentativas = 0, mudouTela = false;

  function rodada() {
    tentativas++;
    return fetch(urlCofre() + "?versao=" + (nuvem.versao || 0), { cache: "no-store" })
      .then(function (r) {
        if (r.status === 404) return { versao: 0 };
        if (!r.ok) return erroServidor(r);
        return r.json();
      })
      .then(function (j) {
        if (!j.dados) return { versao: j.versao || 0, remoto: null };
        return N.decifrar(nuvem.chave, j.dados).then(
          function (rem) { return { versao: j.versao, remoto: rem }; },
          function () { throw new Error("não consegui abrir o cofre — a senha é a mesma do outro aparelho?"); });
      })
      .then(function (x) {
        if (x.remoto) {
          var antes = N.canonico(estado);
          N.mesclar(estado, x.remoto);
          if (N.canonico(estado) !== antes) { gravarLocal(); mudouTela = true; }
        }
        var precisa = nuvem.pendente || x.versao === 0 ||
          (x.remoto && N.canonico(estado) !== N.canonico(N.completar(x.remoto)));
        if (!precisa) { nuvem.versao = x.versao; return; }
        return N.cifrar(nuvem.chave, estado).then(function (dados) {
          return fetch(urlCofre(), {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ versaoAnterior: x.versao, dados: dados })
          });
        }).then(function (r) {
          if (r.status === 409 && tentativas < 5) return rodada();
          if (!r.ok) return erroServidor(r);
          return r.json().then(function (j) {
            nuvem.versao = j.versao;
            nuvem.pendente = editouDurante;   // mexeram no meio: sobe de novo na próxima
          });
        });
      });
  }

  return rodada().then(function () {
    nuvem.quando = Date.now();
    gravarNuvem();
    nuvemErro = "";
    mostrarNuvem("ok");
    if (mudouTela) desenhar();
  }, function (err) {
    nuvemErro = err && err.message || String(err);
    gravarNuvem();
    mostrarNuvem(err instanceof TypeError || navigator.onLine === false ? "offline" : "erro");
    agendarNuvem(30000);
  }).then(function () {
    sincronizando = false;
    if (editouDurante) agendarNuvem(300);
  });
}

function mostrarNuvem(st) {
  nuvemStatus = st;
  var ind = $("#nuvem-ind");
  ind.hidden = !nuvem.id;
  ind.className = "nuvem-ind" + (st === "erro" ? " erro" : "");
  ind.textContent = { indo: "sincronizando…", ok: "✓ sincronizado", offline: "sem internet", erro: "⚠ sincronização", off: "" }[st] || "";
  ind.title = nuvemErro || "";
  var el = $("#nuvem-status");
  if (el) el.innerHTML = textoNuvem();
}
function textoNuvem() {
  if (nuvemStatus === "indo") return "Sincronizando…";
  if (nuvemStatus === "offline") return "Sem conexão. As mudanças ficam guardadas aqui e sobem quando a internet voltar.";
  if (nuvemStatus === "erro") return '<span style="color:var(--ruim)">⚠ ' + esc(nuvemErro) + "</span>";
  return "✓ Sincronizado" + (nuvem.quando ? " às " + new Date(nuvem.quando).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) : "") + ".";
}

function conectar(senha, servidor) {
  senha = N.limparSenha(senha);
  servidor = (servidor || "").trim().replace(/\/+$/, "");
  if (senha.length < 12) { brinde("A senha do casal precisa de pelo menos 12 caracteres. Use “Gerar”."); return Promise.resolve(); }
  if (!servidor && !servidorPadrao()) { brinde("Informe o endereço do servidor (o do Worker publicado)."); return Promise.resolve(); }
  if (!window.crypto || !crypto.subtle) { brinde("Este navegador não tem criptografia disponível: abra pelo endereço https."); return Promise.resolve(); }
  brinde("Abrindo o cofre…", 8000);
  var base = servidor || servidorPadrao();
  return N.derivarCofre(senha).then(function (c) {
    return fetch(base + "/api/cofre/" + c.id + "?versao=-1", { cache: "no-store" }).then(function (r) {
      if (r.status === 404 && !confirm("Ainda não existe cofre com essa senha.\n\nSe é a primeira vez de vocês, OK cria um novo.\nSe a outra pessoa já conectou, cancele e confira a senha.")) {
        throw new Error("cancelado");
      }
      if (r.status !== 404 && !r.ok) return erroServidor(r);
      nuvem = {
        servidor: servidor, id: c.id, chave: c.chave, versao: 0, senha: senha,
        pendente: estado.transacoes.length > 0 || estado.configAlterada > 0
      };
      gravarNuvem();
      return sincronizar();
    });
  }).then(function () {
    if (nuvem.id && nuvemStatus === "ok") brinde("Conectado: este aparelho agora vê o mesmo que o outro.");
    desenhar();
  }).catch(function (err) {
    if (err.message !== "cancelado") brinde("Não deu para conectar: " + (err.message || err));
  });
}

function linkConvite() {
  return (baseServidor() || servidorPadrao()) + "/#cofre=" + encodeURIComponent(nuvem.senha || "");
}

/* --------------------------------------------------------------- formato */
var fmtBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
function brl(v) { return fmtBRL.format(v || 0); }
function brlCurto(v) {
  if (Math.abs(v) >= 1000) return "R$ " + (v / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mil";
  return "R$ " + Math.round(v).toLocaleString("pt-BR");
}
function dataBR(d) { return d.slice(8, 10) + "/" + d.slice(5, 7); }
function nomeMes(m) { return MESES[Number(m.slice(5, 7)) - 1] + " de " + m.slice(0, 4); }
function nome(p) { return estado.pessoas[p].nome || (p === "p1" ? "Pessoa 1" : "Pessoa 2"); }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function $(sel, raiz) { return (raiz || document).querySelector(sel); }
function $$(sel, raiz) { return Array.prototype.slice.call((raiz || document).querySelectorAll(sel)); }
function bolinha(p) { return '<span class="bolinha b-' + p + '"></span>'; }

/* ------------------------------------------------------------------ abas */
var abaAtiva = "resumo";
$$(".aba").forEach(function (b) {
  b.addEventListener("click", function () { trocarAba(b.dataset.aba); });
});
function trocarAba(a) {
  abaAtiva = a;
  $$(".aba").forEach(function (b) { b.setAttribute("aria-selected", String(b.dataset.aba === a)); });
  $$(".painel").forEach(function (p) { p.classList.toggle("ativo", p.id === "painel-" + a); });
  $(".mes-nav").style.display = (a === "resumo" || a === "transacoes") ? "" : "none";
  desenhar();
}
$("#mes-ant").addEventListener("click", function () { mesAtual = N.somarMes(mesAtual, -1); desenhar(); });
$("#mes-prox").addEventListener("click", function () { mesAtual = N.somarMes(mesAtual, 1); desenhar(); });

function desenhar() {
  $("#mes-nome").textContent = nomeMes(mesAtual);
  if (abaAtiva === "resumo") desenharResumo();
  else if (abaAtiva === "transacoes") desenharTransacoes();
  else if (abaAtiva === "cartao") desenharCartao();
  else if (abaAtiva === "importar") desenharImportar();
  else desenharConfig();
}

/* ------------------------------------------------------------------ dica */
var dica = $("#dica");
document.addEventListener("mousemove", function (ev) {
  var alvo = ev.target.closest && ev.target.closest("[data-dica]");
  if (!alvo) { dica.style.display = "none"; return; }
  dica.textContent = alvo.dataset.dica;
  dica.style.display = "block";
  var w = dica.offsetWidth, h = dica.offsetHeight;
  var x = ev.clientX + 14, y = ev.clientY + 14;
  if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
  if (y + h > window.innerHeight - 8) y = ev.clientY - h - 14;
  dica.style.left = Math.max(8, x) + "px"; dica.style.top = Math.max(8, y) + "px";
});

/* ---------------------------------------------------------------- brinde */
var brindeTimer;
function brinde(html, ms) {
  var b = $("#brinde");
  b.innerHTML = typeof html === "string" ? esc(html) : "";
  if (typeof html !== "string") b.appendChild(html);
  b.style.display = "flex";
  clearTimeout(brindeTimer);
  brindeTimer = setTimeout(function () { b.style.display = "none"; }, ms || 3500);
}

/* ================================================================ RESUMO */
function desenharResumo() {
  var el = $("#painel-resumo");
  if (!estado.transacoes.length) {
    el.innerHTML = '<div class="cartao vazio"><strong>Nenhuma transação ainda</strong>' +
      'Comece pela aba <a href="#" data-ir="importar">Importar</a>: é só arrastar o CSV ou OFX ' +
      'que o app do Nubank exporta, de cada um de vocês.<br><br>' +
      'Antes, vale dar nome às duas pessoas em <a href="#" data-ir="config">Configurar</a>.<br><br>' +
      (nuvem.id ? "" : 'Se a outra pessoa já começou, peça o link de convite — ou conecte este aparelho em <a href="#" data-ir="config">Configurar</a> com a senha do casal.') +
      "</div>";
    ligarLinks(el);
    return;
  }
  var r = N.resumoMes(estado, mesAtual);
  var ant = N.resumoMes(estado, N.somarMes(mesAtual, -1));
  var serie = N.serieMeses(estado, mesAtual, 6);

  var delta = "";
  if (ant.total > 0) {
    var dp = (r.total - ant.total) / ant.total * 100;
    delta = '<span class="' + (dp > 0 ? "delta-sobe" : "delta-desce") + '">' +
      (dp > 0 ? "▲ " : "▼ ") + Math.abs(dp).toFixed(0) + "%</span> vs. " + MESES[Number(N.somarMes(mesAtual, -1).slice(5, 7)) - 1];
  }

  var h = '<div class="grade grade-kpi">';
  h += kpi("Gastos do mês", brl(r.total), (delta || "sem mês anterior para comparar"));
  h += kpi("Despesas do casal", brl(r.casal),
    Math.round(N.pct(estado, "p1") * 100) + "% " + esc(nome("p1")) + " · " + Math.round(N.pct(estado, "p2") * 100) + "% " + esc(nome("p2")));
  ["p1", "p2"].forEach(function (p) {
    h += kpi(bolinha(p) + esc(nome(p)), brl(r.custo[p]),
      "pessoal " + brl(r.pessoal[p]) + " + parte do casal " + brl(r.custo[p] - r.pessoal[p]) +
      "<br>saiu da conta/cartão: " + brl(r.pagou[p]) +
      (r.entradas[p] ? '<br><span class="delta-desce">entrou ' + brl(r.entradas[p]) + "</span>" : ""));
  });
  h += "</div>";

  h += '<div class="grade grade-2">';

  /* Categorias */
  h += '<div class="cartao"><h2>Por categoria</h2>' + legenda("quem pagou");
  if (!r.categorias.length) h += '<p class="sub">Nada gasto neste mês.</p>';
  var maxCat = 0;
  r.categorias.forEach(function (c) { maxCat = Math.max(maxCat, c.total, c.orcamento); });
  r.categorias.forEach(function (c) {
    var w1 = maxCat ? c.p1 / maxCat * 100 : 0, w2 = maxCat ? c.p2 / maxCat * 100 : 0;
    var d = c.nome + "\n" + nome("p1") + ": " + brl(c.p1) + "\n" + nome("p2") + ": " + brl(c.p2) +
      (c.orcamento ? "\nOrçamento: " + brl(c.orcamento) : "");
    h += '<div class="cat-linha" data-dica="' + esc(d) + '">' +
      '<div class="cat-nome">' + esc(c.nome) + "</div>" +
      '<div class="cat-trilho"><div class="cat-barra">' +
      (c.p1 > 0 ? '<div class="b-p1" style="width:' + w1 + '%"></div>' : "") +
      (c.p2 > 0 ? '<div class="b-p2" style="width:' + w2 + '%"></div>' : "") +
      "</div>" +
      (c.orcamento ? '<div class="cat-meta" style="left:' + (c.orcamento / maxCat * 100) + '%"></div>' : "") +
      "</div>" +
      '<div class="cat-valor">' + brl(c.total) + "</div>";
    if (c.orcamento) {
      var p = c.total / c.orcamento * 100, acima = c.total > c.orcamento;
      h += '<div class="cat-orc' + (acima ? " acima" : "") + '">' +
        (acima ? "⚠ " + brl(c.total - c.orcamento) + " acima do orçamento de " + brl(c.orcamento)
               : Math.round(p) + "% do orçamento de " + brl(c.orcamento) + " · sobram " + brl(c.orcamento - c.total)) +
        "</div>";
    }
    h += "</div>";
  });
  h += "</div>";

  /* Coluna da direita: meses + maiores gastos */
  h += "<div>";

  /* Últimos 6 meses */
  var maxM = 0;
  serie.forEach(function (m) { maxM = Math.max(maxM, m.total); });
  h += '<div class="cartao"><h2>Últimos 6 meses</h2>' + legenda("quem pagou");
  h += '<div class="colunas">';
  serie.forEach(function (m) {
    var d = nomeMes(m.mes) + "\nTotal: " + brl(m.total) + "\n" + nome("p1") + ": " + brl(m.p1) + "\n" + nome("p2") + ": " + brl(m.p2);
    h += '<div class="coluna' + (m.mes === mesAtual ? " atual" : "") + '" data-dica="' + esc(d) + '">' +
      (m.p1 > 0 ? '<div class="b-p1" style="height:' + (maxM ? m.p1 / maxM * 100 : 0) + '%"></div>' : "") +
      (m.p2 > 0 ? '<div class="b-p2" style="height:' + (maxM ? m.p2 / maxM * 100 : 0) + '%"></div>' : "") +
      "</div>";
  });
  h += '</div><div class="col-rotulos">';
  serie.forEach(function (m) {
    h += "<div>" + MESES_CURTOS[Number(m.mes.slice(5, 7)) - 1] + "<br>" + (m.total ? brlCurto(m.total) : "–") + "</div>";
  });
  h += "</div></div>";

  /* Maiores gastos */
  h += '<div class="cartao"><h2>Maiores gastos do mês</h2><ul class="lista-simples">';
  r.maiores.forEach(function (t) {
    var p = N.pessoaDaConta(t.conta);
    h += '<li><span class="desc-curta" title="' + esc(t.descricao) + '">' + bolinha(p) + " " + esc(N.descricaoCurta(t.descricao)) +
      ' <span class="mudo">· ' + dataBR(t.data) + '</span></span><span class="num">' + brl(t.valor) + "</span></li>";
  });
  if (!r.maiores.length) h += '<li class="sub">Nada neste mês.</li>';
  h += "</ul></div>";
  h += "</div></div>";

  el.innerHTML = h;
}

function kpi(rotulo, valor, det) {
  return '<div class="cartao kpi"><div class="rotulo">' + rotulo + '</div><div class="valor">' + valor +
    '</div><div class="det">' + det + "</div></div>";
}
function legenda(sufixo) {
  return '<div class="legenda"><span>' + bolinha("p1") + esc(nome("p1")) + "</span><span>" +
    bolinha("p2") + esc(nome("p2")) + '</span><span class="mudo">(' + sufixo + ")</span></div>";
}
function ligarLinks(el) {
  $$("[data-ir]", el).forEach(function (a) {
    a.addEventListener("click", function (ev) { ev.preventDefault(); trocarAba(a.dataset.ir); });
  });
}

/* ============================================================ TRANSAÇÕES */
function desenharTransacoes() {
  var el = $("#painel-transacoes");
  var h = '<div class="cartao">';
  h += '<div class="filtros">' +
    '<input type="search" id="f-busca" placeholder="Buscar descrição…" value="' + esc(filtro.busca) + '">' +
    '<select id="f-pessoa"><option value="">Os dois</option>' +
    '<option value="p1">' + esc(nome("p1")) + '</option><option value="p2">' + esc(nome("p2")) + "</option></select>" +
    '<select id="f-cat"><option value="">Todas as categorias</option>' + opcoesCategoria("") + "</select>" +
    '<select id="f-div"><option value="">Pessoal e casal</option><option value="casal">Só do casal</option><option value="pessoal">Só pessoais</option></select>' +
    '<label class="sub"><input type="checkbox" id="f-todos"' + (filtro.todos ? " checked" : "") + "> todos os meses</label>" +
    '<button class="botao" id="nova-tx">+ Lançar à mão</button>' +
    "</div>";
  h += '<div id="form-nova"></div>';
  h += '<div class="tx-cab"><div>Data</div><div>Descrição</div><div>Quem</div><div>Categoria</div><div>Divisão</div><div style="text-align:right">Valor</div><div></div></div>';
  h += '<div id="lista-tx"></div>';
  h += "</div>";
  el.innerHTML = h;

  $("#f-pessoa").value = filtro.pessoa;
  $("#f-cat").value = filtro.categoria;
  $("#f-div").value = filtro.divisao;
  $("#f-busca").addEventListener("input", function () { filtro.busca = this.value; desenharLista(); });
  $("#f-pessoa").addEventListener("change", function () { filtro.pessoa = this.value; desenharLista(); });
  $("#f-cat").addEventListener("change", function () { filtro.categoria = this.value; desenharLista(); });
  $("#f-div").addEventListener("change", function () { filtro.divisao = this.value; desenharLista(); });
  $("#f-todos").addEventListener("change", function () { filtro.todos = this.checked; desenharLista(); });
  $("#nova-tx").addEventListener("click", formNova);
  desenharLista();
}

function opcoesCategoria(sel) {
  return estado.categorias.map(function (c) {
    return '<option value="' + esc(c.id) + '"' + (c.id === sel ? " selected" : "") + ">" + esc(c.nome) + "</option>";
  }).join("");
}

function desenharLista() {
  var busca = N.normalizar(filtro.busca);
  var lista = estado.transacoes.filter(function (t) {
    if (!filtro.todos && N.mesDe(t.data) !== mesAtual) return false;
    if (filtro.pessoa && N.pessoaDaConta(t.conta) !== filtro.pessoa) return false;
    if (filtro.categoria && t.categoria !== filtro.categoria) return false;
    if (filtro.divisao && (t.divisao !== filtro.divisao || !N.ehGasto(t))) return false;
    if (busca && N.normalizar(t.descricao).indexOf(busca) === -1) return false;
    return true;
  });
  var LIMITE = 500;
  var h = "", soma = 0;
  lista.forEach(function (t) { if (N.ehGasto(t)) soma += t.valor; });
  lista.slice(0, LIMITE).forEach(function (t) {
    var p = N.pessoaDaConta(t.conta), gasto = N.ehGasto(t);
    var cls = !gasto ? (t.categoria === "entradas" ? "entrada" : "fora") : "";
    h += '<div class="tx" data-id="' + esc(t.id) + '">' +
      "<div>" + dataBR(t.data) + (filtro.todos ? "/" + t.data.slice(2, 4) : "") + "</div>" +
      '<div class="tx-desc" title="' + esc(t.descricao) + '">' + esc(N.descricaoCurta(t.descricao)) + "</div>" +
      '<div class="quem">' + bolinha(p) + esc(nome(p)) + " · " + esc(N.TIPOS_CONTA[N.tipoDaConta(t.conta)] || "") + "</div>" +
      '<div><select data-campo="categoria" aria-label="Categoria">' + opcoesCategoria(t.categoria) + "</select></div>" +
      "<div>" + (gasto
        ? '<select data-campo="divisao" aria-label="Divisão"><option value="pessoal"' + (t.divisao === "pessoal" ? " selected" : "") + ">Só de " + esc(nome(p)) + '</option><option value="casal"' + (t.divisao === "casal" ? " selected" : "") + ">Do casal</option></select>"
        : '<span class="mudo" style="font-size:13px">fora da conta</span>') + "</div>" +
      '<div class="valor ' + cls + '">' + (t.valor < 0 ? "+ " + brl(-t.valor) : brl(t.valor)) + "</div>" +
      '<div><button class="botao-x" data-apagar aria-label="Apagar" title="Apagar">×</button></div>' +
      "</div>";
  });
  if (!lista.length) h = '<div class="vazio">Nenhuma transação ' + (filtro.todos ? "com esses filtros." : "em " + nomeMes(mesAtual) + " com esses filtros.") + "</div>";
  if (lista.length > LIMITE) h += '<div class="sub" style="padding:8px">Mostrando ' + LIMITE + " de " + lista.length + ". Use a busca ou os filtros para achar o resto.</div>";
  h += '<div class="tx-total"><span>' + lista.length + " transaç" + (lista.length === 1 ? "ão" : "ões") + '</span><span>Gastos: ' + brl(soma) + "</span></div>";
  var el = $("#lista-tx");
  el.innerHTML = h;

  $$("select[data-campo]", el).forEach(function (s) {
    s.addEventListener("change", function () {
      var id = s.closest(".tx").dataset.id;
      var t = estado.transacoes.filter(function (x) { return x.id === id; })[0];
      if (!t) return;
      t[s.dataset.campo] = s.value;
      if (s.dataset.campo === "categoria") {
        var c = N.categoria(estado, s.value);
        if (N.ehGasto(t) && !t.manualDivisao) t.divisao = c && c.casal ? "casal" : "pessoal";
      } else t.manualDivisao = true;
      t.manual = true;
      t.alterado = Date.now();
      salvar();
      desenharLista();
      if (s.dataset.campo === "categoria") oferecerRegra(t);
    });
  });
  $$("[data-apagar]", el).forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.closest(".tx").dataset.id;
      var t = estado.transacoes.filter(function (x) { return x.id === id; })[0];

/* Depois de trocar a categoria de uma transação, propõe virar regra. */
function oferecerRegra(t) {
  var termo = N.sugerirTermo(t.descricao);
  if (!termo) return;
  var c = N.categoria(estado, t.categoria);
  var caixa = document.createElement("span");
  caixa.style.display = "contents";
  caixa.innerHTML = '<span>Sempre que aparecer</span><input type="text" value="' + esc(termo) + '">' +
    "<span>→ " + esc(c ? c.nome : t.categoria) + "?</span><button>Criar regra</button><button>Não</button>";
  var bts = caixa.querySelectorAll("button");
  bts[0].addEventListener("click", function () {
    var termo2 = N.normalizar(caixa.querySelector("input").value);
    if (!termo2) return;
    estado.regras = estado.regras.filter(function (r) { return N.normalizar(r.termo) !== termo2; });
    estado.regras.push({ termo: termo2, categoria: t.categoria, divisao: "" });
    var n = N.reaplicarRegras(estado);
    salvarConfig();
    brinde("Regra criada" + (n ? " e aplicada em mais " + n + " transaç" + (n === 1 ? "ão" : "ões") : "") + ".");
    desenhar();
  });
  bts[1].addEventListener("click", function () { $("#brinde").style.display = "none"; });
  brinde(caixa, 12000);
}

function lerTexto(arq) {
  return arq.text ? arq.arrayBuffer().then(decodificar) : new Promise(function (ok, erro) {
    var fr = new FileReader();
    fr.onload = function () { ok(decodificar(fr.result)); };
    fr.onerror = erro;
    fr.readAsArrayBuffer(arq);
  });
}
/* OFX de banco às vezes vem em Latin-1: se o UTF-8 der caractere quebrado, relê. */
function decodificar(buf) {
  var t = new TextDecoder("utf-8").decode(buf);
  if (t.indexOf("�") !== -1) t = new TextDecoder("windows-1252").decode(buf);
  return t;
}

function lerArquivos(lista) {
  var arqs = Array.prototype.slice.call(lista || []);
  var log = $("#log");
  var p = pessoaImport;
  var ultimoMes = "";
  arqs.reduce(function (cadeia, arq) {
    return cadeia.then(function () { return lerTexto(arq); }).then(function (texto) {
      var lido = N.lerArquivo(texto);
      var conta = p + "-" + lido.tipo;
      var r = N.importar(estado, conta, lido.itens, lido.formato);
      salvar();
      var meses = {};
      lido.itens.forEach(function (i) { meses[N.mesDe(i.data)] = true; });
      var ms = Object.keys(meses).sort();
      if (ms.length && ms[ms.length - 1] > ultimoMes) ultimoMes = ms[ms.length - 1];
      log.insertAdjacentHTML("afterbegin", "<div>✓ <strong>" + esc(arq.name) + "</strong> → " + esc(nome(p)) + " · " +
        N.TIPOS_CONTA[lido.tipo] + ": " + r.novas + " nova" + (r.novas === 1 ? "" : "s") +
        (r.repetidas ? ", " + r.repetidas + " já estava" + (r.repetidas === 1 ? "" : "m") + " aqui" : "") + "</div>");
    }).catch(function (err) {
      log.insertAdjacentHTML("afterbegin", '<div class="erro">✗ <strong>' + esc(arq.name) + "</strong>: " + esc(err.message || err) + "</div>");
    });
  }, Promise.resolve()).then(function () {
    if (ultimoMes) mesAtual = ultimoMes;
    $("#mes-nome").textContent = nomeMes(mesAtual);
  });
}

    '<button class="botao" id="reaplicar">Reaplicar regras</button></div>';
  h += '<div class="linha-form"><input type="search" id="busca-regra" placeholder="Filtrar regras…" style="flex:1"></div>';
  h += '<div class="rolar" style="max-height:360px;overflow-y:auto;margin-top:8px"><table class="tabela-conf"><thead><tr><th>Termo</th><th>Categoria</th><th>Divisão</th><th></th></tr></thead><tbody id="tab-regras">';
  regras.forEach(function (x) {
    var c = N.categoria(estado, x.r.categoria);
    h += '<tr data-regra="' + x.i + '" data-busca="' + esc(N.normalizar(x.r.termo + " " + (c ? c.nome : ""))) + '"><td>' + esc(x.r.termo) + "</td><td>" + esc(c ? c.nome : x.r.categoria) +
      "</td><td>" + (x.r.divisao === "casal" ? "do casal" : x.r.divisao === "pessoal" ? "pessoal" : '<span class="mudo">da categoria</span>') +
      '</td><td><button class="botao-x" data-apagar-regra title="Apagar regra">×</button></td></tr>';
  });
  h += "</tbody></table></div></div>";

  /* Backup */
  h += '<div class="cartao"><h2>Backup</h2>' +
    '<p class="sub" style="margin-top:0">' + (nuvem.id
      ? "Os dados ficam neste aparelho e no cofre cifrado. Um backup em arquivo é a garantia extra, caso a senha se perca."
      : "Sem o cofre conectado, tudo fica só <strong>neste navegador</strong>. “Juntar backup” soma o arquivo de outro aparelho a este, sem duplicar.") + "</p>" +
    '<div class="linha-form"><button class="botao primario" id="exportar">Exportar backup</button>' +
    '<button class="botao" id="juntar">Juntar backup…</button>' +
    '<button class="botao perigo" id="apagar-tudo">Apagar tudo</button></div>' +
    '<p class="sub">' + estado.transacoes.length + " transações salvas.</p></div>";

  el.innerHTML = h;

  /* ligações */
  $$("input[data-pessoa]", el).forEach(function (i) {
    i.addEventListener("change", function () {
      estado.pessoas[i.dataset.pessoa][i.dataset.k] = i.value.trim();
      if (i.dataset.k === "nomeBanco") N.reaplicarRegras(estado);
      salvarConfig(); desenharConfig();
    });
  });
  $("#c-div").addEventListener("change", function () {
    var v = Math.min(100, Math.max(0, Number(this.value) || 0));
    estado.divisao.p1 = v; salvarConfig(); desenharConfig();
  });
  $$("tr[data-cat] input", el).forEach(function (i) {
    i.addEventListener("change", function () {
      var c = N.categoria(estado, i.closest("tr").dataset.cat);
      if (i.dataset.k === "casal") c.casal = i.checked;
      else if (i.dataset.k === "orcamento") c.orcamento = Number(i.value) || 0;
      else c.nome = i.value.trim() || c.nome;
      salvarConfig();
    });
  });
  $$("[data-apagar-cat]", el).forEach(function (b) {
    b.addEventListener("click", function () {
      var id = b.closest("tr").dataset.cat, c = N.categoria(estado, id);
      var n = estado.transacoes.filter(function (t) { return t.categoria === id; }).length;
      if (!confirm('Apagar a categoria "' + c.nome + '"?' + (n ? "\n\n" + n + " transações vão para Outros." : ""))) return;
      estado.categorias = estado.categorias.filter(function (x) { return x.id !== id; });
      estado.regras = estado.regras.filter(function (r) { return r.categoria !== id; });
      estado.transacoes.forEach(function (t) { if (t.categoria === id) t.categoria = "outros"; });
      salvarConfig(); desenharConfig();
    });
  });
  $("#add-cat").addEventListener("click", function () {
    var n = $("#nova-cat").value.trim();
    if (!n) return;
    var id = N.normalizar(n).replace(/ /g, "-") || "cat";
    while (N.categoria(estado, id)) id += "-2";
    var i = estado.categorias.findIndex(function (c) { return c.id === "outros"; });
    estado.categorias.splice(i < 0 ? estado.categorias.length : i, 0, { id: id, nome: n, casal: false, orcamento: 0 });
    salvarConfig(); desenharConfig();
  });
  $("#add-regra").addEventListener("click", function () {
    var t = N.normalizar($("#nova-regra-termo").value);
    if (!t) return;
    estado.regras = estado.regras.filter(function (r) { return N.normalizar(r.termo) !== t; });
    estado.regras.push({ termo: t, categoria: $("#nova-regra-cat").value, divisao: $("#nova-regra-div").value });
    var n = N.reaplicarRegras(estado);
    salvarConfig(); desenharConfig();
    brinde("Regra criada" + (n ? ", " + n + " transações mudaram." : "."));
  });
  $("#reaplicar").addEventListener("click", function () {
    var n = N.reaplicarRegras(estado);
    salvar();
    brinde(n ? n + " transações mudaram de categoria." : "Nada mudou: tudo já seguia as regras.");
  });
  $("#busca-regra").addEventListener("input", function () {
    var q = N.normalizar(this.value);
    $$("#tab-regras tr").forEach(function (tr) { tr.style.display = !q || tr.dataset.busca.indexOf(q) !== -1 ? "" : "none"; });
  });
  $$("[data-apagar-regra]", el).forEach(function (b) {
    b.addEventListener("click", function () {
      estado.regras.splice(Number(b.closest("tr").dataset.regra), 1);
      salvarConfig(); desenharConfig();
    });
  });
  $("#exportar").addEventListener("click", function () {
    var blob = new Blob([JSON.stringify(estado, null, 1)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "financas-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });
  $("#juntar").addEventListener("click", function () { $("#arquivo-backup").click(); });
  $("#apagar-tudo").addEventListener("click", function () {
    var msg = nuvem.id
      ? "Apagar tudo DESTE APARELHO e desconectar do cofre?\n\nO cofre e o celular da outra pessoa continuam intactos."
      : "Apagar TODAS as transações, regras e categorias deste navegador?\n\nExporte um backup antes se quiser guardar.";
    if (!confirm(msg)) return;
    nuvem = {}; gravarNuvem(); mostrarNuvem("off");
    estado = N.estadoPadrao(); gravarLocal(); desenharConfig(); brinde("Tudo apagado deste aparelho.");
  });
  if (!nuvem.id) {
    $("#nuvem-gerar").addEventListener("click", function () { $("#nuvem-senha").value = N.gerarSenha(); });
    $("#nuvem-conectar").addEventListener("click", function () {
      conectar($("#nuvem-senha").value, $("#nuvem-servidor") ? $("#nuvem-servidor").value : "");
    });
  } else {
    $("#nuvem-agora").addEventListener("click", function () { sincronizar(); });
    $("#nuvem-sair").addEventListener("click", function () {
      if (!confirm("Desconectar este aparelho do cofre?\n\nOs dados continuam aqui e no cofre; para voltar, é só usar a senha de novo.")) return;
      nuvem = {}; gravarNuvem(); mostrarNuvem("off"); desenharConfig();
    });
    if ($("#nuvem-convite")) $("#nuvem-convite").addEventListener("click", function () {
      var link = linkConvite();
      var copiar = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(link) : Promise.reject();
      copiar.then(function () { brinde("Link copiado. Mande só para a outra pessoa."); },
                  function () { prompt("Copie o link e mande só para a outra pessoa:", link); });
    });
  }
}

$("#arquivo-backup").addEventListener("change", function () {
  var arq = this.files[0];
  this.value = "";
  if (!arq) return;
  lerTexto(arq).then(function (t) {
    var outro = JSON.parse(t);
    if (!outro || !Array.isArray(outro.transacoes)) throw new Error("não parece um backup deste app");
    var n = N.mesclar(estado, outro);
    salvar(); desenhar();
    brinde(n + " transações novas vieram do backup.");
  }).catch(function (err) { brinde("Não deu para ler o backup: " + (err.message || err)); });
});

/* ------------------------------------------------------------------ início */
if (window.FINANCAS_PLUGGY) {
  var r = N.importarPluggy(estado, window.FINANCAS_PLUGGY);
  salvar();
  if (r.novas) setTimeout(function () { brinde(r.novas + " transações novas do Open Finance."); }, 300);
}
/* Abre no último mês que tem dado, se o atual estiver vazio. */
if (estado.transacoes.length && !estado.transacoes.some(function (t) { return N.mesDe(t.data) === mesAtual; })) {
  mesAtual = N.mesDe(estado.transacoes[0].data);
}
$("#nuvem-ind").addEventListener("click", function () { trocarAba("config"); });
trocarAba("resumo");

/* Link de convite: .../#cofre=senha. O que vem depois do # não vai para o
   servidor; tiro da barra de endereço logo em seguida. */
var convite = /[#&]cofre=([^&]+)/.exec(location.hash);
if (convite) {
  history.replaceState(null, "", location.pathname + location.search);
  var senhaConvite = decodeURIComponent(convite[1]);
  if (!nuvem.id) { trocarAba("config"); conectar(senhaConvite, ""); }
  else if (N.limparSenha(senhaConvite) !== nuvem.senha) brinde("Este aparelho já está conectado a um cofre. Desconecte em Configurar para usar o convite.", 8000);
}
if (nuvem.id) {
  mostrarNuvem("indo");
  sincronizar();
}
setInterval(function () { if (nuvem.id && !document.hidden) sincronizar(); }, 60000);
document.addEventListener("visibilitychange", function () { if (nuvem.id && !document.hidden) sincronizar(); });
window.addEventListener("online", function () { if (nuvem.id) sincronizar(); });
})();
</script>
</body>
</html>
